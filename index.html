});

/* ---- сигара ---- */
const CIGAR_CM = 15;
let ashRecord = load('perekur.ashRecord', 0);
const cmText = cm => cm.toFixed(1).replace('.', ',') + ' см';
const cutPrep = {
  start:'cut',
  init(m){ m.cutT = 0; m.cutPos = 0; },
  range(m){ return m.L * .075; },
  down(m){
    const d = m.cutPos, L = m.L;
    m.cut = d; sfx.cut();
    let word;
    if(d < L * .012){ m.drawF = .55; word = 'Мелко: тугая тяга'; }
    else if(d > L * .042){ m.burnF = 1.5; m.drawF = 1.15; word = 'Глубоко: обёртка поползёт'; }
    else word = 'Ровный срез';
    const [x, y] = m.toW(m.x0, 0), D = m.D, body = m.c.body;
    E.chunks.push({x, y, vx:rand(-60, -20), vy:-80, ang:m.ang, va:rand(-5, 5), broke:true,
      draw(){ g.fillStyle = vgrad(-D / 2, D / 2, body); g.beginPath(); g.ellipse(d / 2, 0, D * .28 + d / 2, D / 2, 0, Math.PI / 2, Math.PI * 1.5); g.fill(); g.fillRect(0, -D / 2, d, D); }});
    floatText(word, m.cx - 60, m.cy - m.D * 1.6);
    m.phase = 'ready';
  },
  up(){}, move(){},
  update(m, dt){ m.cutT += dt; m.cutPos = (Math.sin(m.cutT * 2.6 - Math.PI / 2) * .5 + .5) * cutPrep.range(m); },
  draw(m){
    m.drawRod();
    const D = m.D, R = D / 2, L = m.L;
    g.save(); g.translate(m.cx, m.cy); g.rotate(m.ang);
    // зона идеального среза
    g.fillStyle = 'rgba(120,220,140,.22)'; g.fillRect(m.x0 + L * .012, -R, L * .03, D);
    g.strokeStyle = 'rgba(120,220,140,.9)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(m.x0 + L * .012, -R - D * .25); g.lineTo(m.x0 + L * .042, -R - D * .25); g.stroke();
    // гильотина
    const x = m.x0 + m.cutPos;
    g.fillStyle = '#2f3339'; rr(x - D * .18, -R - D * .75, D * .36, D * .75 - 2, 4); g.fill();
    rr(x - D * .18, R + 2, D * .36, D * .6, 4); g.fill();
    g.fillStyle = 'rgba(220,226,235,.55)'; g.fillRect(x - 1, -R - 2, 2, D + 4);
    g.fillStyle = '#4a5058'; rr(x - D * .1, -R - D * 1.3, D * .2, D * .6, D * .1); g.fill();
    g.restore();
  },
  hint(){ return 'Сначала обрежь сигару. Нажми, когда лезвие в зелёной зоне'; }
};
MODES.cigar = makeRod('cigar', {
  name:'Сигара', butt:'cigar', wk:.82, maxL:680, dk:.15, minD:20, tipK:0, tip:'cap', tex:'leaf', seed:11, reserve:.2, mouthy:true, stiff:.25,
  body:['#4a2e18', '#8a5c32', '#6a4322', '#2f1c0d'], footCol:'#3a2410',
  burnIdle:1 / 600, burnPuff:1 / 30, cough:1.6, ash:[.3, .5], ashCols:ASH_CIGAR, light:'torch', prep:cutPrep,
  side:'166,172,188', exh:'208,200,190', density:1.6, size:1.3, alpha:1.15, sideSize:1.4, sideRate:40,
  hintLit:'Сигару не затягивают: короткие затяжки. Держи пепел подольше',
  // рекорд за сессию показываем из памяти, а в хранилище пишем один раз в конце
  stats:m => [['Затяжек', m.puffs], ['Пепел', cmText(m.ash * CIGAR_CM)], ['Рекорд', cmText(Math.max(ashRecord, m.maxAsh * CIGAR_CM))]],
  end:m => {
    const cm = m.maxAsh * CIGAR_CM, isNew = cm > ashRecord + .05;
    if(isNew){ ashRecord = cm; save('perekur.ashRecord', cm); }
    showEnd('Сигара докурена', `${puffWord(m.puffs)} за ${fmtTime(m.litTime)}`,
      `Самый длинный пепел: ${cmText(cm)}${isNew ? ', новый рекорд' : ''}. До кольца не докуривают, остаток оставляют в пепельнице.`, 'Ещё одну');
  }
});

/* ---- трубка ---- */
MODES.pipe = (() => {
  const m = {id:'pipe', name:'Трубка', warns:W_TOB};
  m.layout = () => {
    const avail = E.bot - E.top;
    m.S = Math.min(W * .95, 620, avail * 1.7);
    m.bw = m.S * .2; m.bh = m.S * .27;
    m.bx = W / 2 + m.S * .3; m.by = (E.top + E.bot) / 2 - m.bh * .35;
  };
  m.reset = () => {
    Object.assign(m, {phase:'pack', fill:0, tamps:0, tampT:0, tob:1, lit:false, done:false, ember:0, boost:0, heat:0, puffs:0,
      lighting:0, match:{on:false, life:0, outIn:-1}, P:newP(), carry:0, tilt:0, knockT:-1, knocked:false, endIn:-1, litTime:0, hold:false, burnt:0});
    m.layout();
  };
  const toW = (lx, ly) => { const co = Math.cos(m.tilt), si = Math.sin(m.tilt); return [m.bx + lx * co - ly * si, m.by + lx * si + ly * co]; };
  m.tray = () => trayAt(m.bx - m.S * .05, m.S * .4);
  m.mouth = () => toW(-m.S * .74, m.bh * .64);
  const rx = () => m.bw * .4, ry = () => m.bw * .13;

  m.down = () => {
    audio();
    if(m.done) return;
    m.hold = true;
    if(m.phase === 'pack'){ m.pressT = E.t; loopStart(3000, .7, .02); return; }
    if(m.phase === 'light'){
      pressP(m);
      if(!m.match.on){ m.match = {on:true, life:0, outIn:-1}; sfx.strike(); }
      return;
    }
    if(m.phase === 'smoke'){ pressP(m); return; }
    if(m.phase === 'knock'){ m.knockT = 0; m.phase = 'knocking'; }
  };
  m.up = () => {
    m.hold = false;
    if(m.phase === 'pack'){
      loopStop();
      if(E.t - m.pressT < .22) tamp();
      return;
    }
    if(m.phase === 'light'){ releaseP(m); m.lighting = 0; return; }
    if(m.phase === 'smoke'){
      if(!m.P.holding) return;
      const r = releaseP(m);
      if(r.puffed){ if(r.amt > .25) addPuff(m); exhale(Math.max(.2, r.amt), {delay:.35, mouth:m.mouth, tint:'210,204,196', density:1.2}); }
      else if(r.tap) tamp();
    }
  };
  m.move = () => {};
  function tamp(){
    m.tampT = .35; sfx.tamp();
    if(m.phase === 'pack'){
      if(m.fill < .1) return;
      m.fill *= .72; m.tamps++;
      if(m.fill >= .78 && m.tamps >= 2){
        m.phase = 'light';
        const [x, y] = toW(-m.bw, -m.bh * .4);
        floatText(m.tamps > 4 ? 'Набита туго' : 'Набита как надо', x - 40, y);
      }
    } else if(m.phase === 'smoke'){ m.boost = 1; const [x, y] = toW(0, 0); dust(x, y - 4, 3); }
  }
  m.update = dt => {
    const P = m.P;
    m.tampT = Math.max(0, m.tampT - dt);
    if(m.phase === 'pack' && m.hold && E.t - m.pressT > .22){
      m.fill = Math.min(1.25, m.fill + dt * .45);
      const [x, y] = toW(rand(-rx(), rx()), -m.S * .3);
      if(Math.random() < dt * 45) crumb(x, y, m.fill > 1.12 ? m.by + m.bh * 1.2 : m.by - (m.fill - 1) * m.bh * .3, pick(['#6b4524', '#8a5a2e', '#4f3218']));
      if(m.fill >= 1.25 && Math.random() < dt * 4){ const [sx, sy] = toW(rx() * (Math.random() < .5 ? -1 : 1), -6); crumb(sx, sy, H + 10); }
    }
    if(m.match.on){
      m.match.life += dt;
      if(m.match.life > 7 || (m.match.outIn > 0 && (m.match.outIn -= dt) <= 0)) m.match.on = false;
    }
    if(m.phase === 'light'){
      if(P.holding && m.match.on){ m.lighting += dt; if(m.lighting > 1.6){ m.phase = 'smoke'; m.lit = true; m.match.outIn = .5; m.fill += .08; } }
    }
    puffTick(m, dt, m.phase === 'smoke');
    if(m.phase === 'smoke'){
      m.litTime += dt;
      m.heat = clamp(m.heat + (P.puffing ? dt * .3 : -dt * .07), 0, 1.2);
      if(m.heat > 1){
        m.heat = .7; stopP(m); addPuff(m);
        const [x, y] = toW(-m.S * .6, 0);
        coughFx(x, y, 'Обжёг язык', {mouth:m.mouth, tint:'210,204,196'});
      }
      m.boost = Math.max(0, m.boost - dt * .4);
      m.tob -= dt * (1 / 450 + P.v / 26);
      m.burnt = 1 - m.tob;
      if(Math.random() < dt * (1 + P.v * 16)) sfx.crackle();
      if(m.tob <= 0){ m.tob = 0; m.phase = 'knock'; stopP(m); m.lit = false; }
    }
    const fl = .05 * Math.sin(E.t * 11) + .04 * Math.sin(E.t * 6.7);
    const target = m.lit ? .3 + .6 * P.v + .25 * m.boost + fl : (m.phase === 'light' && P.holding && m.match.on ? m.lighting / 1.6 * .5 : 0);
    m.ember += (target - m.ember) * Math.min(1, dt * 6);
    if(m.lit || m.ember > .1){
      m.carry += dt * 22 * (.3 + m.ember);
      while(m.carry > 1){ m.carry--; const [x, y] = toW(rand(-rx() * .6, rx() * .6), -3); sideSmoke(x, y, '172,182,204', 1.2); }
    }
    if(m.phase === 'knocking'){
      m.knockT += dt;
      const k = Math.min(1, m.knockT / 1.1);
      m.tilt = -Math.sin(k * Math.PI) * 2.1;
      if(m.knockT > .45 && !m.knocked){
        m.knocked = true; sfx.knock();
        const [x, y] = toW(0, 0), T = m.tray(), s = m.bw * .5;
        dust(x, y, 10, '110,106,100');
        E.chunks.push({x, y, vx:T ? (T.x - x) * 1.2 : 0, vy:40, ang:0, va:3, broke:true, land:true, ash:.3,
          draw(){ g.fillStyle = '#4a4642'; g.beginPath(); g.ellipse(0, 0, s, s * .55, 0, 0, Math.PI * 2); g.fill(); g.fillStyle = '#7a756e'; g.beginPath(); g.ellipse(-s * .2, -s * .15, s * .5, s * .25, 0, 0, Math.PI * 2); g.fill(); }});
      }
      if(m.knockT > 1.2){ m.done = true; m.phase = 'done'; m.knocked = false; bump('pipe'); m.endIn = .5; }
    }
    if(m.endIn > 0){ m.endIn -= dt; if(m.endIn <= 0) showEnd('Трубка выкурена', `${puffWord(m.puffs)} за ${fmtTime(m.litTime)}`, `Трубок здесь выкурено: ${totals.pipe}. Дай ей остыть, прежде чем набивать снова.`, 'Набить ещё'); }
  };
  m.draw = () => {
    const S = m.S, bw = m.bw, bh = m.bh;
    const [gx, gy] = toW(0, 0);
    drawBg(gx, gy, m.ember);
    g.save(); g.translate(m.bx, m.by); g.rotate(m.tilt);
    // тень
    if(!m.tilt){ g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(-S * .3, bh * 1.25, S * .45, bh * .1, 0, 0, Math.PI * 2); g.fill(); }
    // мундштук
    g.fillStyle = vgrad(bh * .6, bh * .85, ['#0d0d0f', '#3a3c42', '#1b1c20', '#050506']);
    g.beginPath(); g.moveTo(-S * .32, bh * .66); g.quadraticCurveTo(-S * .52, bh * .63, -S * .74, bh * .62);
    g.lineTo(-S * .74, bh * .71); g.quadraticCurveTo(-S * .52, bh * .76, -S * .32, bh * .84); g.closePath(); g.fill();
    // хвостовик
    g.fillStyle = vgrad(bh * .55, bh * .92, ['#5a2c14', '#a1613a', '#7a4120', '#3a1a0a']);
    g.beginPath(); g.moveTo(-bw * .4, bh * .55); g.lineTo(-S * .32, bh * .64); g.lineTo(-S * .32, bh * .86); g.lineTo(-bw * .25, bh * .93); g.closePath(); g.fill();
    g.fillStyle = '#c8ccd2'; g.fillRect(-S * .325, bh * .635, 4, bh * .23);
    // чаша
    g.beginPath(); g.moveTo(-bw / 2, 0); g.bezierCurveTo(-bw / 2, bh * .7, -bw * .35, bh, 0, bh); g.bezierCurveTo(bw * .35, bh, bw / 2, bh * .7, bw / 2, 0); g.closePath();
    const bg = g.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    bg.addColorStop(0, '#3a1a0a'); bg.addColorStop(.35, '#a1613a'); bg.addColorStop(.6, '#7a4120'); bg.addColorStop(1, '#2a1206');
    g.fillStyle = bg; g.fill();
    if(m.heat > .4){ g.fillStyle = `rgba(255,60,20,${(m.heat - .4) * .25})`; g.fill(); }
    g.save(); g.clip(); g.strokeStyle = 'rgba(30,10,0,.25)'; g.lineWidth = 1;
    for(let i = 0; i < 9; i++){ const x = -bw * .42 + i * bw * .105; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + bw * .04, bh * .4, x - bw * .03, bh * .7, x * .6, bh); g.stroke(); }
    g.restore();
    // обод и жерло
    g.fillStyle = '#8a5230'; g.beginPath(); g.ellipse(0, 0, bw / 2, bw * .17, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#140a05'; g.beginPath(); g.ellipse(0, 0, rx(), ry(), 0, 0, Math.PI * 2); g.fill();
    // табак
    const f = m.phase === 'pack' || m.phase === 'light' ? m.fill : m.tob * .95;
    if(f > .05){
      const vis = clamp(f, 0, 1);
      g.save(); g.beginPath(); g.ellipse(0, 0, rx(), ry(), 0, 0, Math.PI * 2); g.clip();
      g.fillStyle = `rgb(${40 + 70 * vis | 0},${22 + 40 * vis | 0},${10 + 15 * vis | 0})`; g.fillRect(-rx(), -ry(), rx() * 2, ry() * 2);
      const r = rng(4);
      for(let i = 0; i < 40 * vis; i++){ g.strokeStyle = r() < .5 ? 'rgba(160,100,50,.6)' : 'rgba(40,20,8,.6)'; g.lineWidth = 1; const x = (r() - .5) * rx() * 2, y = (r() - .5) * ry() * 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + r() * 6 - 3, y + r() * 2 - 1); g.stroke(); }
      if(m.ember > .02){
        g.globalCompositeOperation = 'lighter';
        const eg = g.createRadialGradient(0, 0, 0, 0, 0, rx());
        eg.addColorStop(0, `rgba(255,150,60,${.8 * m.ember})`); eg.addColorStop(1, `rgba(255,60,10,${.2 * m.ember})`);
        g.fillStyle = eg; g.fillRect(-rx(), -ry(), rx() * 2, ry() * 2);
        g.globalCompositeOperation = 'source-over';
        if(m.burnt > .2){ g.fillStyle = `rgba(120,116,110,${Math.min(.6, m.burnt * .6)})`; g.fillRect(-rx(), -ry(), rx() * 2, ry() * 2); }
      }
      g.restore();
      if(f > 1){
        const mh = (f - 1) * bh * .5;
        g.fillStyle = '#7a4e28'; g.beginPath(); g.ellipse(0, 0, rx() * 1.05, mh + ry(), 0, Math.PI, 0); g.fill();
      }
    }
    // тампер
    if(m.tampT > 0){
      const k = Math.sin((1 - m.tampT / .35) * Math.PI), y = -S * .32 + k * S * .26;
      g.fillStyle = '#b8bec6'; rr(-bw * .09, y, bw * .18, S * .12, 3); g.fill();
      g.fillStyle = '#7c838c'; g.beginPath(); g.ellipse(0, y + S * .12, bw * .14, bw * .04, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    glowAt(gx, gy, bw * (1 + m.ember), m.ember * .8);
    if(m.match.on){
      const life = m.match.life, fl = life > 6 ? Math.max(0, 7 - life) : Math.min(1, life * 6);
      drawMatch(m.bx + bw * .12, m.by - bw * .25, -.7, bw * .9, Math.min(1, life / 7), fl);
    }
    // шкала жара
    if(m.phase === 'smoke'){
      const x = m.bx + bw * .75, y = m.by, h = bh;
      g.fillStyle = 'rgba(233,229,221,.12)'; g.fillRect(x, y, 4, h);
      g.fillStyle = m.heat > .8 ? '#ff6a1f' : '#e9e5dd'; g.fillRect(x, y + h * (1 - clamp(m.heat, 0, 1)), 4, h * clamp(m.heat, 0, 1));
    }
  };
  m.hint = () => {
    if(m.phase === 'pack'){
      if(m.fill > 1.2) return 'Через край. Нажми коротко, чтобы утрамбовать';
      return m.fill < .05 ? 'Зажми, чтобы насыпать табак в чашу' : `Зажми — сыпать, нажми коротко — утрамбовать. Утрамбовано ${m.tamps} из 2+`;
    }
    if(m.phase === 'light') return m.match.on ? 'Зажми, чтобы раскурить над чашей' : 'Нажми, чтобы чиркнуть спичкой';
    if(m.phase === 'smoke'){
      if(m.P.puffing) return m.heat > .8 ? 'Трубка горячая, отпусти' : 'Затяжка…';
      return 'Тяни понемногу, не перегревай · нажми коротко, чтобы подтрамбовать';
    }
    if(m.phase === 'knock') return 'Табак догорел. Нажми, чтобы выбить трубку';
    return '';
  };
  m.stats = () => [['Затяжек', m.puffs], ['Жар', Math.round(clamp(m.heat, 0, 1) * 100) + '%'], ['Табак', Math.round((m.phase === 'pack' || m.phase === 'light' ? clamp(m.fill, 0, 1) : m.tob) * 100) + '%']];
  return m;
})();

/* ---- кальян ---- */
const HOOK_FLAV = ['Мята', 'Двойное яблоко', 'Виноград', 'Арбуз', 'Лимон'];
MODES.hookah = (() => {
  const m = {id:'hookah', name:'Кальян', warns:W_HOOK};
  m.layout = () => {
    const avail = E.bot - E.top;
    m.S = Math.min(avail * .98, W * 1.05, 700);
    m.hx = W / 2 + m.S * .2; m.yt = E.top + (avail - m.S) / 2;
  };
  m.reset = () => {
    Object.assign(m, {coals:0, drops:[], heat:0, ash:0, tob:1, puffs:0, P:newP(), vs:0, bub:[], done:false, endIn:-1, carry:0, flav:pick(HOOK_FLAV), time:0});
    m.layout();
  };
  const Y = k => m.yt + m.S * k;
  m.mouth = () => [m.hx - m.S * .46, Y(.3)];
  m.down = (x, y) => {
    audio(); if(m.done) return;
    if(m.coals < 3){ m.coals++; m.drops.push(0); sfx.place(); return; }
    pressP(m); m.downY = y;
  };
  m.up = (x, y) => {
    if(!m.P.holding) return;
    const r = releaseP(m);
    if(r.puffed){
      if(r.amt > .25) addPuff(m);
      m.vsOut = true;
      exhale(Math.max(.25, r.amt) * (.35 + m.heat), {delay:.45, mouth:m.mouth, tint:'226,226,222', density:2, size:1.5, alpha:1.15, speed:1.4, dir:-.75});
    } else if(r.tap){
      if(y < Y(.2) && x > m.hx - m.S * .2 && x < m.hx + m.S * .2){
        if(m.ash > .05){ dust(m.hx, Y(.03), 12, '170,166,160'); sfx.tamp(); }
        m.ash = Math.max(0, m.ash - .8); m.heat = Math.min(1, m.heat + .05);
        floatText('Повороши', m.hx + m.S * .15, Y(.05));
      }
    }
  };
  m.move = () => {};
  m.update = dt => {
    const P = m.P;
    m.drops = m.drops.map(v => Math.min(1, v + dt * 4));
    if(m.coals > 0){
      m.time += dt;
      m.ash = Math.min(1, m.ash + dt / 50);
      const target = (m.coals / 3) * (1 - m.ash * .65);
      m.heat += (target - m.heat) * dt * .18;
    }
    puffTick(m, dt, m.coals === 3 && !m.done, [500, .6, .05, 'lowpass']);
    if(P.puffing){
      m.heat += dt * .06;
      if(Math.random() < dt * 22) sfx.bubble();
      if(Math.random() < dt * 30) m.bub.push({x:m.hx + rand(-6, 6), y:Y(.9), r:rand(2, 5), vy:rand(-90, -50)});
      m.vs = Math.min(1, m.vs + dt * (.2 + m.heat * .6));
      m.tob -= dt * m.heat / 22;
      if(P.inhaled > 4.5 || m.heat > 1.15){
        stopP(m); addPuff(m);
        coughFx(m.mouth()[0], m.mouth()[1], m.heat > 1.15 ? 'Горчит' : 'кхе-кхе', {mouth:m.mouth, tint:'226,226,222', dir:-.75});
        if(m.heat > 1.15) m.heat = .8;
      }
    } else m.vs = Math.max(0, m.vs - dt * (m.vsOut ? .9 : .2));
    if(m.vs <= 0) m.vsOut = false;
    for(let i = m.bub.length - 1; i >= 0; i--){ const b = m.bub[i]; b.y += b.vy * dt; b.x += Math.sin(b.y * .1) * .3; if(b.y < Y(.8)) m.bub.splice(i, 1); }
    if(m.coals === 3 && Math.random() < dt * 8 * m.heat){ sideSmoke(m.hx + rand(-m.S * .06, m.S * .06), Y(.02), '190,196,210', 1.3); }
    if(m.tob <= 0 && !m.done){ m.tob = 0; m.done = true; stopP(m); bump('hookah'); m.endIn = 1.5; }
    if(m.endIn > 0){ m.endIn -= dt; if(m.endIn <= 0) showEnd('Чаша докурена', `${puffWord(m.puffs)} за ${fmtTime(m.time)}`, `Вкус: ${m.flav.toLowerCase()}. Кальянов здесь выкурено: ${totals.hookah}.`, 'Забить новую'); }
  };
  function coal(x, y, s, glow, ash){
    g.fillStyle = '#1c1715'; rr(x - s / 2, y - s / 2, s, s, s * .15); g.fill();
    if(glow > .02){
      g.globalCompositeOperation = 'lighter';
      const cg = g.createRadialGradient(x, y + s * .3, 0, x, y, s * .8);
      cg.addColorStop(0, `rgba(255,120,40,${.9 * glow})`); cg.addColorStop(1, 'rgba(255,60,10,0)');
      g.fillStyle = cg; rr(x - s / 2, y - s / 2, s, s, s * .15); g.fill();
      g.globalCompositeOperation = 'source-over';
    }
    if(ash > .02){ g.fillStyle = `rgba(170,165,158,${ash * .85})`; rr(x - s / 2, y - s / 2, s, s * (.4 + ash * .6), s * .15); g.fill(); }
  }
  m.draw = () => {
    const S = m.S, hx = m.hx;
    drawBg(hx, Y(.05), m.heat * .9);
    // кальянная колба
    const vy = Y(.82), vr = S * .16;
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(hx, Y(.99), vr * 1.1, S * .02, 0, 0, Math.PI * 2); g.fill();
    g.save(); g.beginPath(); g.arc(hx, vy, vr, 0, Math.PI * 2); g.clip();
    g.fillStyle = 'rgba(160,200,230,.07)'; g.fillRect(hx - vr, vy - vr, vr * 2, vr * 2);
    if(m.vs > .01){ g.fillStyle = `rgba(225,225,220,${m.vs * .7})`; g.fillRect(hx - vr, vy - vr, vr * 2, vr * .9 + 4); }
    g.fillStyle = 'rgba(60,120,170,.35)'; g.fillRect(hx - vr, Y(.8), vr * 2, vr * 2);
    g.fillStyle = 'rgba(150,200,240,.35)'; g.fillRect(hx - vr, Y(.8), vr * 2, 1.5);
    g.fillStyle = 'rgba(200,205,212,.5)'; g.fillRect(hx - S * .01, Y(.62), S * .02, S * .28);
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1;
    for(const b of m.bub){ g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.stroke(); }
    g.restore();
    g.strokeStyle = 'rgba(200,225,240,.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(hx, vy, vr, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.ellipse(hx - vr * .45, vy - vr * .3, vr * .12, vr * .4, .3, 0, Math.PI * 2); g.fill();
    // горлышко
    g.fillStyle = 'rgba(160,200,230,.12)'; g.fillRect(hx - S * .04, Y(.62), S * .08, S * .06);
    g.strokeStyle = 'rgba(200,225,240,.3)'; g.strokeRect(hx - S * .04, Y(.62), S * .08, S * .06);
    // шланг
    g.lineCap = 'round';
    g.strokeStyle = '#272b33'; g.lineWidth = S * .032;
    g.beginPath(); g.moveTo(hx - S * .06, Y(.42)); g.bezierCurveTo(hx - S * .3, Y(1.0), hx - S * .62, Y(.88), hx - S * .5, Y(.42)); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = S * .008; g.stroke();
    g.strokeStyle = '#a9afb8'; g.lineWidth = S * .02;
    g.beginPath(); g.moveTo(hx - S * .5, Y(.42)); g.lineTo(hx - S * .465, Y(.31)); g.stroke();
    g.lineCap = 'butt';
    // шахта
    g.fillStyle = hgrad(hx - S * .022, hx + S * .022, ['#5a6068', '#d8dde4', '#9aa1aa', '#4a5058']);
    g.fillRect(hx - S * .022, Y(.18), S * .044, S * .45);
    for(const k of [.26, .34, .5, .58]){ g.fillStyle = hgrad(hx - S * .04, hx + S * .04, ['#5a6068', '#e2e6ec', '#a0a7b0', '#4a5058']); g.beginPath(); g.ellipse(hx, Y(k), S * .04, S * .012, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = hgrad(hx - S * .07, hx - S * .02, ['#5a6068', '#d8dde4', '#9aa1aa', '#4a5058']); g.fillRect(hx - S * .07, Y(.41), S * .05, S * .022);
    // блюдце
    g.fillStyle = hgrad(hx - S * .16, hx + S * .16, ['#4a5058', '#d0d5dc', '#959ca6', '#3a4048']);
    g.beginPath(); g.ellipse(hx, Y(.2), S * .16, S * .024, 0, 0, Math.PI * 2); g.fill();
    // чаша
    const bt = Y(.075), bb = Y(.185);
    g.fillStyle = hgrad(hx - S * .1, hx + S * .1, ['#6a2a14', '#c9643a', '#9a4422', '#4a1a0a']);
    g.beginPath(); g.moveTo(hx - S * .1, bt); g.lineTo(hx + S * .1, bt); g.lineTo(hx + S * .045, bb); g.lineTo(hx - S * .045, bb); g.closePath(); g.fill();
    g.fillStyle = '#c9ced6'; g.beginPath(); g.ellipse(hx, bt, S * .1, S * .016, 0, 0, Math.PI * 2); g.fill();
    // угли
    const cs = S * .052;
    for(let i = 0; i < m.coals; i++){
      const d = m.drops[i] ?? 1, cx = hx + (i - 1) * S * .062, cy = Y(.045) - (1 - d) * S * .25;
      coal(cx, cy, cs, (m.heat * (1 - m.ash * .7)) * (.7 + .3 * Math.sin(E.t * 3 + i)), m.ash);
    }
    if(m.coals < 3){
      for(let i = m.coals; i < 3; i++){ g.strokeStyle = 'rgba(233,229,221,.18)'; g.setLineDash([3, 3]); g.strokeRect(hx + (i - 1) * S * .062 - cs / 2, Y(.045) - cs / 2, cs, cs); g.setLineDash([]); }
    }
    glowAt(hx, Y(.045), S * .2, m.heat * (1 - m.ash * .6) * .7);
    // шкала жара
    const x = hx + S * .2, y0 = Y(.08), h = S * .3;
    g.fillStyle = 'rgba(233,229,221,.12)'; g.fillRect(x, y0, 4, h);
    g.fillStyle = m.heat > 1 ? '#ff6a1f' : '#e9e5dd'; g.fillRect(x, y0 + h * (1 - clamp(m.heat / 1.15, 0, 1)), 4, h * clamp(m.heat / 1.15, 0, 1));
  };
  m.hint = () => {
    if(m.done) return '';
    if(m.coals < 3) return `Нажми, чтобы положить уголь (${m.coals} из 3)`;
    if(m.P.puffing) return 'Тяну…';
    if(m.heat < .35) return 'Чаша прогревается. Можно тянуть, но дыма пока мало';
    if(m.ash > .5) return 'Угли покрылись золой. Нажми на угли, чтобы поворошить';
    return 'Зажми, чтобы тянуть · нажми на угли, чтобы поворошить';
  };
  m.stats = () => [['Затяжек', m.puffs], ['Жар', Math.round(clamp(m.heat, 0, 1.2) * 100) + '%'], ['Чаша', Math.round(m.tob * 100) + '%'], ['Вкус', m.flav]];
  return m;
})();

/* ---- электронка ---- */
const VAPE_FLAV = [
  {n:'Арбуз', c:['#5a1029', '#e0577f', '#b8325c', '#3e0a1c'], led:'255,80,130', tint:'238,226,232'},
  {n:'Манго-лёд', c:['#7a3c10', '#f6b04a', '#d88a2a', '#5a2a08'], led:'255,190,80', tint:'240,236,226'},
  {n:'Черника', c:['#141c4a', '#6a7ff0', '#3a4bb0', '#0c1234'], led:'110,140,255', tint:'226,228,242'},
  {n:'Мята', c:['#083d32', '#4fd1b0', '#2a9a80', '#052a22'], led:'80,240,200', tint:'226,242,236'}
];
MODES.vape = (() => {
  const m = {id:'vape', name:'Электронка', warns:W_NIC, endless:true};
  m.layout = () => {
    const avail = E.bot - E.top;
    m.Hd = Math.min(avail * .62, 330, W * .85); m.wd = m.Hd * .27;
    m.cx = W / 2 + m.Hd * .12; m.cy = (E.top + E.bot) / 2 + m.Hd * .06; m.ang = -.45;
  };
  m.reset = () => { Object.assign(m, {f:pick(VAPE_FLAV), puffs:0, P:newP(), led:0, wig:0, wigV:0}); m.layout(); };
  const toW = (lx, ly) => { const a = m.ang + m.wig, co = Math.cos(a), si = Math.sin(a); return [m.cx + lx * co - ly * si, m.cy + lx * si + ly * co]; };
  m.mouth = () => toW(0, -m.Hd / 2 - m.Hd * .17);
  m.down = () => { audio(); pressP(m); };
  m.up = () => {
    if(!m.P.holding) return;
    const r = releaseP(m);
    if(r.puffed){
      if(r.amt > .25) addPuff(m);
      exhale(Math.max(.3, r.amt) * 1.2, {delay:.35, mouth:m.mouth, tint:m.f.tint, density:1.8, size:1.9, alpha:.8, speed:1.35, dir:-.3, dur:1.6});
    } else if(r.tap){ m.wigV += 1; sfx.click(); }
  };
  m.move = () => {};
  m.update = dt => {
    puffTick(m, dt, true, [3800, .7, .03]);
    const P = m.P;
    if(P.puffing && Math.random() < dt * 14) sfx.crackle();
    if(P.puffing && P.inhaled > 4){ stopP(m); addPuff(m); coughFx(m.mouth()[0], m.mouth()[1], 'Гарь!', {mouth:m.mouth, tint:m.f.tint, dir:-.3}); }
    m.led += ((P.puffing ? 1 : 0) - m.led) * Math.min(1, dt * 12);
    m.wigV += (-m.wig * 400 - m.wigV * 12) * dt; m.wig += m.wigV * dt;
  };
  m.draw = () => {
    const Hd = m.Hd, wd = m.wd, [lx, ly] = toW(0, Hd / 2 - wd * .45);
    drawBg(lx, ly, m.led * .8, m.f.led);
    g.save(); g.translate(m.cx, m.cy); g.rotate(m.ang + m.wig);
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(wd * .6, Hd * .1, wd * .6, Hd * .55, 0, 0, Math.PI * 2); g.fill();
    // мундштук
    g.fillStyle = hgrad(-wd * .4, wd * .4, ['#050506', '#3a3c42', '#16171a', '#050506']);
    g.beginPath(); g.moveTo(-wd * .4, -Hd / 2 + 4); g.lineTo(-wd * .28, -Hd / 2 - Hd * .15); g.quadraticCurveTo(0, -Hd / 2 - Hd * .17, wd * .28, -Hd / 2 - Hd * .15); g.lineTo(wd * .4, -Hd / 2 + 4); g.closePath(); g.fill();
    g.fillStyle = '#000'; g.fillRect(-wd * .12, -Hd / 2 - Hd * .162, wd * .24, 2);
    // корпус
    g.fillStyle = hgrad(-wd / 2, wd / 2, m.f.c); rr(-wd / 2, -Hd / 2, wd, Hd, wd * .3); g.fill();
    g.fillStyle = 'rgba(255,255,255,.18)'; rr(-wd * .3, -Hd / 2 + wd * .2, wd * .08, Hd - wd * .4, wd * .04); g.fill();
    // надпись
    g.save(); g.rotate(-Math.PI / 2); g.fillStyle = 'rgba(255,255,255,.88)'; g.font = `600 ${wd * .32}px Oswald, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(m.f.n.toUpperCase(), 0, 0); g.restore();
    // светодиод
    g.fillStyle = m.led > .05 ? `rgba(${m.f.led},${.4 + .6 * m.led})` : 'rgba(0,0,0,.4)';
    g.beginPath(); g.arc(0, Hd / 2 - wd * .45, wd * .1, 0, Math.PI * 2); g.fill();
    g.restore();
    glowAt(lx, ly, wd * 1.5, m.led, m.f.led);
  };
  m.hint = () => {
    if(m.P.puffing) return m.P.inhaled > 3 ? 'Испаритель сейчас подгорит' : 'Затяжка…';
    return 'Зажми, чтобы затянуться. Сразу после затяжки можно сделать трюк';
  };
  m.stats = () => [['Затяжек', m.puffs], ['Трюков', E.tricks], ['Вкус', m.f.n]];
  return m;
})();

/* ---- айкос ---- */
const HEAT_PUFFS = 14;
MODES.heat = (() => {
  const m = {id:'heat', name:'Айкос', warns:W_NIC};
  m.layout = () => {
    const avail = E.bot - E.top;
    m.Lh = Math.min(W * .6, 400, avail * 1.4); m.Dh = m.Lh * .14;
    m.cx = W / 2 + m.Lh * .18; m.cy = (E.top + E.bot) / 2 + avail * .04; m.ang = -.07;
  };
  m.reset = () => { Object.assign(m, {phase:'insert', ins:0, out:0, press:0, heatT:0, left:HEAT_PUFFS, puffs:0, P:newP(), buzz:0, buzzIn:-1, led:0, done:false, endIn:-1, stain:0}); m.layout(); };
  const toW = (lx, ly) => { const co = Math.cos(m.ang), si = Math.sin(m.ang); return [m.cx + lx * co - ly * si, m.cy + lx * si + ly * co]; };
  const stickX = () => -m.Lh / 2 - m.Lh * .3 - (1 - m.ins) * m.Lh * .4 - m.out * m.Lh * .6;
  m.tray = () => trayAt(m.cx - m.Lh * .45, m.Lh * .5);
  m.mouth = () => toW(stickX() - m.Dh * .3, -m.Dh * .2);
  function vibrate(n){ m.buzz = .3 * n; sfx.buzz(n); }
  m.down = () => {
    audio(); if(m.done) return;
    if(m.phase === 'insert'){ m.phase = 'inserting'; sfx.slide(); return; }
    if(m.phase === 'remove'){ m.phase = 'removing'; sfx.slide(); return; }
    pressP(m);
  };
  m.up = () => {
    if(!m.P.holding) return;
    const r = releaseP(m);
    if(m.phase === 'smoke' && r.puffed){
      if(r.amt > .3){ addPuff(m); m.left--; m.stain = Math.min(1, m.stain + 1 / HEAT_PUFFS); if(m.left <= 2 && m.left > 0) vibrate(1); }
      exhale(Math.max(.2, r.amt) * .8, {delay:.4, mouth:m.mouth, tint:'232,232,230', density:.9, alpha:.8});
      if(m.left <= 0){ m.phase = 'remove'; m.buzzIn = .6; }
    }
    if(m.phase === 'press') m.press = 0;
  };
  m.move = () => {};
  m.update = dt => {
    const P = m.P;
    m.buzz = Math.max(0, m.buzz - dt);
    if(m.buzzIn > 0){ m.buzzIn -= dt; if(m.buzzIn <= 0) vibrate(2); }
    if(m.phase === 'inserting'){ m.ins = Math.min(1, m.ins + dt * 3); if(m.ins >= 1) m.phase = 'press'; }
    if(m.phase === 'press' && P.holding){ m.press += dt; if(m.press > 1.2){ m.phase = 'heating'; m.heatT = 0; vibrate(1); stopP(m); } }
    if(m.phase === 'heating'){ m.heatT += dt; if(m.heatT > 7){ m.phase = 'smoke'; vibrate(2); } }
    puffTick(m, dt, m.phase === 'smoke', [1100, .6, .015]);
    if(P.puffing && P.inhaled > 3.5){ stopP(m); addPuff(m); m.left--; coughFx(m.mouth()[0], m.mouth()[1], 'кхе', {mouth:m.mouth, tint:'232,232,230'}); if(m.left <= 0) m.phase = 'remove'; }
    if(m.phase === 'removing'){
      m.out = Math.min(1, m.out + dt * 2.5);
      if(m.out >= 1){
        m.done = true; m.phase = 'done'; bump('heat'); m.endIn = .6;
        const [x, y] = toW(stickX() + m.Lh * .27, 0), Ds = m.Dh * .55, Ls = m.Lh * .55, st = m.stain, T = m.tray();
        E.chunks.push({x, y, vx:T ? (T.x - x) * 1.1 : -30, vy:-60, ang:m.ang, va:-2, broke:true, land:true, butt:'heat', draw(){ stick(-Ls / 2, Ds, Ls, st); }});
      }
    }
    m.led = m.phase === 'heating' ? .5 + .5 * Math.sin(E.t * 6) : m.phase === 'smoke' ? 1 : m.phase === 'press' && P.holding ? 1 : 0;
    if(m.endIn > 0){ m.endIn -= dt; if(m.endIn <= 0) showEnd('Стик закончился', `${puffWord(m.puffs)}`, `Стиков здесь выкурено: ${totals.heat}. Держатель надо поставить на зарядку, а лезвие иногда чистить.`, 'Новый стик'); }
  };
  function stick(x, Ds, Ls, stain){
    const R = Ds / 2;
    g.fillStyle = vgrad(-R, R, ['#d8d2c6', '#fbf8f2', '#ebe5d9', '#a9a295']); g.fillRect(x, -R, Ls, Ds);
    g.fillStyle = vgrad(-R, R, ['#cfc6b4', '#f3ecde', '#e2d8c4', '#9c917c']); g.fillRect(x, -R, Ls * .45, Ds);
    g.fillStyle = '#b89a5a'; g.fillRect(x + Ls * .45, -R, 2, Ds);
    if(stain > 0){ const sg = g.createLinearGradient(x + Ls * .55, 0, x + Ls, 0); sg.addColorStop(0, 'rgba(120,80,40,0)'); sg.addColorStop(1, `rgba(120,80,40,${.5 * stain})`); g.fillStyle = sg; g.fillRect(x + Ls * .5, -R, Ls * .5, Ds); }
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(x, -R, 2, Ds);
  }
  m.draw = () => {
    const Lh = m.Lh, Dh = m.Dh, R = Dh / 2;
    const [bx, by] = toW(Lh * .15, -R);
    drawBg(bx, by, m.led * .5, '220,230,255');
    const jx = m.buzz > 0 ? rand(-1.5, 1.5) : 0, jy = m.buzz > 0 ? rand(-1.5, 1.5) : 0;
    g.save(); g.translate(m.cx + jx, m.cy + jy); g.rotate(m.ang);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, R * 2.6, Lh * .55, R * .5, 0, 0, Math.PI * 2); g.fill();
    if(m.phase !== 'done') stick(stickX(), Dh * .55, Lh * .55, m.stain);
    // держатель
    g.fillStyle = vgrad(-R, R, ['#2a2d33', '#767b86', '#4a4e56', '#16181c']); rr(-Lh / 2, -R, Lh, Dh, R); g.fill();
    g.fillStyle = vgrad(-R, R, ['#33363d', '#8a909b', '#575c65', '#1c1e22']); rr(-Lh / 2, -R, Lh * .2, Dh, R); g.fill();
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(-Lh / 2 + Lh * .2, -R, 1.5, Dh);
    g.fillStyle = '#0a0b0d'; g.beginPath(); g.ellipse(-Lh / 2 + 2, 0, Dh * .08, Dh * .3, 0, 0, Math.PI * 2); g.fill();
    // кнопка и диод
    g.fillStyle = m.P.holding && m.phase === 'press' ? '#9aa0a8' : '#5d626b'; rr(Lh * .1, -R - 2, Lh * .1, 5, 2.5); g.fill();
    if(m.led > .02){ g.fillStyle = `rgba(230,240,255,${m.led})`; g.beginPath(); g.arc(Lh * .3, -R * .55, 2.2, 0, Math.PI * 2); g.fill(); }
    // сегменты: затяжки или прогрев
    const n = HEAT_PUFFS, sw = Lh * .38 / n;
    for(let i = 0; i < n; i++){
      let on = 0;
      if(m.phase === 'heating') on = i < Math.floor(m.heatT / 7 * n) ? .9 : 0;
      else if(m.phase === 'smoke' || m.phase === 'remove') on = i < m.left ? (m.left <= 2 ? .5 + .5 * Math.sin(E.t * 10) : .9) : 0;
      g.fillStyle = on ? (m.phase === 'heating' ? `rgba(255,190,90,${on})` : `rgba(230,240,255,${on})`) : 'rgba(255,255,255,.08)';
      g.fillRect(-Lh * .05 + i * sw, R * .25, sw * .6, 2.5);
    }
    if(m.phase === 'press' && m.P.holding){ g.strokeStyle = 'rgba(230,240,255,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(Lh * .15, -R - 1, Dh * .5, -Math.PI, -Math.PI + Math.PI * clamp(m.press / 1.2, 0, 1)); g.stroke(); }
    g.restore();
    glowAt(bx, by, Dh * 1.2, m.led * .4, '220,230,255');
  };
  m.hint = () => ({
    insert:'Нажми, чтобы вставить стик',
    inserting:'',
    press:'Зажми кнопку, чтобы включить нагрев',
    heating:'Нагревается, подожди…',
    smoke:m.P.puffing ? 'Затяжка…' : `Зажми, чтобы затянуться. Осталось ${m.left} ${plural(m.left, 'затяжка', 'затяжки', 'затяжек')}`,
    remove:'Стик закончился. Нажми, чтобы вытащить',
    removing:'', done:''
  })[m.phase];
  m.stats = () => [['Затяжек', m.puffs], ['Осталось', m.phase === 'smoke' || m.phase === 'remove' ? m.left : '—'], ['Стиков', totals.heat || 0]];
  return m;
})();

/* ================= переключение и ввод ================= */
let M = null;
function setMode(id){
  if(!MODES[id]) id = 'cigarette';
  if(M && M.P) stopP(M);
  loopStop();
  M = MODES[id];
  E.parts.length = 0; E.chunks.length = 0; E.texts.length = 0; E.rings.length = 0; E.exh.length = 0; E.hold = null; E.tricks = 0;
  $('end').hidden = true;
  M.warnIdx = M.warnIdx === undefined ? Math.floor(Math.random() * M.warns.length) : M.warnIdx;
  $('warn').textContent = M.warns[M.warnIdx];
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false'));
  const cur = document.querySelector(`.tab[data-id="${id}"]`); if(cur) cur.scrollIntoView({block:'nearest', inline:'nearest'});
  measure(); M.reset(); lastHud = '';
}
function restart(){
  $('end').hidden = true;
  M.warnIdx = (M.warnIdx + 1) % M.warns.length;
  $('warn').textContent = M.warns[M.warnIdx];
  M.reset(); lastHud = '';
}
const tabs = $('tabs');
for(const id of ORDER){
  const b = document.createElement('button');
  b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = id; b.textContent = MODES[id].name;
  b.addEventListener('click', () => { if(location.hash !== '#' + id) location.hash = id; else setMode(id); });
  tabs.appendChild(b);
}
window.addEventListener('hashchange', () => setMode(location.hash.slice(1)));

function pos(e){ E.px = e.clientX; E.py = e.clientY; }
let pointerDown = false, route = 'mode';
// нажатие уходит в трюк (если дым во рту), в пепельницу или в текущий предмет
function press(x, y){
  pointerDown = true;
  if(E.hold){ route = 'hold'; E.hold.down = {x:x ?? 0, y:y ?? 0, t:E.t}; return; }
  const busy = M.P && (M.P.holding || M.P.puffing);
  if(!busy && x !== undefined && inTray(x, y)){ route = 'tray'; return; }
  route = 'mode'; M.down(x, y);
}
function unpress(x, y){
  if(!pointerDown) return; pointerDown = false;
  if(route === 'hold'){ const h = E.hold; if(h && h.down){ const d = h.down; h.down = null; holdGesture(x - d.x, y - d.y, E.t - d.t); } return; }
  if(route === 'tray'){ if(inTray(x, y)){ audio(); emptyTray(); } return; }
  M.up(x, y);
}
cv.addEventListener('pointerdown', e => { if(e.button && e.button !== 0) return; try{ cv.setPointerCapture(e.pointerId); }catch(_){} pos(e); press(E.px, E.py); });
cv.addEventListener('pointermove', e => { pos(e); if(pointerDown && route === 'mode') M.move(E.px, E.py); });
const up = e => { if(e && e.clientX !== undefined) pos(e); unpress(E.px, E.py); };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
let spaceDown = false;
window.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('button')) { if(e.code === 'Space') return; }
  if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat && !spaceDown){ spaceDown = true; press(undefined, undefined); } }
  if(e.code === 'KeyF' && M.key) M.key('f');
});
window.addEventListener('keyup', e => { if(e.code === 'Space' && spaceDown){ e.preventDefault(); spaceDown = false; unpress(E.hold && E.hold.down ? E.hold.down.x : undefined, E.hold && E.hold.down ? E.hold.down.y : undefined); } });
window.addEventListener('blur', () => { spaceDown = false; unpress(E.px, E.py); });

$('mute').addEventListener('click', () => {
  muted = !muted; save('perekur.muted', muted);
  if(muted) loopStop();
  $('mute').textContent = muted ? 'Звук: выкл' : 'Звук: вкл';
});
$('mute').textContent = muted ? 'Звук: выкл' : 'Звук: вкл';
$('diaryBtn').addEventListener('click', () => openDiary(false));
function fireLabel(){ const l = LIGHTERS.find(x => x.id === lighterId); $('fire').textContent = 'Огонь: ' + l.n; }
$('fire').addEventListener('click', () => {
  const i = LIGHTERS.findIndex(x => x.id === lighterId);
  lighterId = LIGHTERS[(i + 1) % LIGHTERS.length].id; save('perekur.lighter', lighterId); fireLabel();
  if(M.LT && !M.lit){ M.lidOpen = false; M.misfire = false; }
});
fireLabel();

/* ================= HUD и цикл ================= */
let lastHud = '';
function hud(){
  const h = E.hold ? 'Дым во рту. Тап: кольцо · свайп вниз: водопад · вверх: призрак · вбок: дракон' : (M.hint() || '');
  const fireVis = !!(M.c && M.c.light === 'lighter');
  if($('fire').hidden === fireVis) { $('fire').hidden = !fireVis; measure(); M.layout(); }
  const st = M.stats();
  const key = h + '|' + JSON.stringify(st);
  if(key === lastHud) return; lastHud = key;
  $('hint').textContent = h;
  $('stats').innerHTML = st.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('');
}
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  E.t += dt; M.update(dt); updateFx(dt); M.draw(); drawFx(); hud();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
setMode(location.hash.slice(1) || 'cigarette');
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); M.layout(); });
requestAnimationFrame(frame);

// Офлайн и установка на телефон; при возврате в приложение проверяем новую сборку
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(reloaded || !hadController) return;
    reloaded = true;
    if(!M || !(M.lit || (M.P && M.P.holding))) location.reload();
  });
}
})();
</script>
