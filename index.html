<style>
/* Одна ночная сцена во весь экран: HUD и вкладки сверху, предмет по центру, предупреждение как на пачке снизу */
:root{
  --bg:#0c0e11;
  --fg:#e9e5dd;
  --dim:#8b9099;
  --ember:#ff6a1f;
  --line:rgba(233,229,221,.14);
  --panel:rgba(12,14,17,.9);
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --text:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hud{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.22em;line-height:1}
.stats{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;min-height:16px}
.stats b{color:var(--fg);font-weight:600}
.chip{pointer-events:auto;font:500 13px var(--text);color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:rgba(233,229,221,.35)}
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:62%}
.diary-card{width:min(100%,420px)}
.dtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.dtable th{font:500 12px var(--text);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:0 0 8px}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable td{padding:7px 0;border-top:1px solid var(--line);text-align:right;color:var(--fg)}
.dtable td.zero{color:var(--dim)}
.dtable tr.sum td{font-weight:600;border-top:1px solid rgba(233,229,221,.35)}
.tabs{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-inline:-4px;padding:2px 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:500 13px var(--text);color:var(--dim);background:rgba(12,14,17,.6);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:#14100c;background:var(--fg);border-color:var(--fg)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.hint{position:fixed;left:0;right:0;text-align:center;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:14px;line-height:1.4;color:var(--dim);letter-spacing:.02em;text-wrap:balance;min-height:2.8em;display:flex;align-items:flex-end;justify-content:center}
.warn{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.warn div{background:#fff;color:#000;border:4px solid #000;outline:2px solid #fff;
  font-family:var(--display);font-weight:600;text-transform:uppercase;text-align:center;
  font-size:clamp(15px,4vw,23px);letter-spacing:.04em;line-height:1.1;padding:9px 16px;width:min(100%,520px)}
.end{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,7,9,.55);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:fade .5s ease both}
.card{width:min(100%,380px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-family:var(--display);font-weight:600;font-size:32px;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;line-height:1.5;color:var(--dim);font-size:14px}
.card .big{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{font:600 15px var(--text);border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);flex:1 1 auto}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1a0b02}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.end{animation:none}}
</style>

<canvas id="scene" aria-label="Симулятор курения. Зажмите, чтобы затянуться, коротко нажмите для действия."></canvas>

<header class="hud" id="hud">
  <div class="top">
    <div>
      <div class="logo">ПЕРЕКУР</div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="chips">
      <button id="fire" class="chip" type="button" hidden>Огонь: зажигалка</button>
      <button id="diaryBtn" class="chip" type="button">Дневник</button>
      <button id="mute" class="chip" type="button">Звук: вкл</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Что курим"></nav>
</header>

<div class="hint" id="hint"></div>
<footer class="warn"><div id="warn">Курение убивает</div></footer>

<div class="end" id="end" hidden>
  <div class="card" id="endCard"></div>
</div>

<div class="end" id="diary" hidden>
  <div class="card diary-card" id="diaryCard"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('scene');
const g = cv.getContext('2d');

/* ================= утилиты ================= */
function load(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100; if(m10 === 1 && m100 !== 11) return a; if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; }
function rr(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function vgrad(y0, y1, cols){ const gr = g.createLinearGradient(0, y0, 0, y1); const st = [0, .25, .6, 1]; cols.forEach((c, i) => gr.addColorStop(st[i], c)); return gr; }
function hgrad(x0, x1, cols){ const gr = g.createLinearGradient(x0, 0, x1, 0); const st = [0, .3, .6, 1]; cols.forEach((c, i) => gr.addColorStop(st[i], c)); return gr; }

const MIN_PER_CIG = 20; // оценка UCL, 2024
const W_TOB = ['Курение убивает','Курение вызывает рак лёгких','Курение вызывает инсульт','Курение вредит окружающим','Курение старит кожу','Курение вызывает импотенцию','Курение вызывает инфаркт'];
const W_HOOK = ['Курение кальяна вредит здоровью','Кальян вызывает рак лёгких','Кальян вредит окружающим'];
const W_NIC = ['Содержит никотин. Вызывает зависимость','Никотин вредит сердцу и сосудам','Никотин вызывает зависимость'];

/* ================= экран ================= */
let W = 0, H = 0, DPR = 1;
const E = {t:0, top:120, bot:500, parts:[], chunks:[], texts:[], rings:[], exh:[], shake:0, px:0, py:0, hold:null, tricks:0};
function measure(){
  E.top = $('hud').getBoundingClientRect().bottom + 6;
  E.bot = $('hint').getBoundingClientRect().top - 10;
  if(E.bot - E.top < 200){ E.bot = Math.min(H - 60, E.top + 200); }
}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  measure();
  if(M) M.layout();
}

/* ================= спрайты ================= */
const sprCache = {};
function spr(rgb){
  if(sprCache[rgb]) return sprCache[rgb];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.45, `rgba(${rgb},.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return sprCache[rgb] = c;
}
const T_SIDE = '176,190,214', T_EXH = '214,212,206', T_DUST = '150,146,140';

/* ================= звук ================= */
let AC = null, NB = null, muted = load('perekur.muted', false), loopN = null;
function audio(){
  if(!AC){
    try{
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const n = AC.sampleRate * 2; NB = AC.createBuffer(1, n, AC.sampleRate);
      const d = NB.getChannelData(0); for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function noise(o){
  if(!AC || muted) return;
  const at = AC.currentTime + (o.at || 0), dur = o.dur || .1;
  const s = AC.createBufferSource(); s.buffer = NB; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = o.type || 'bandpass';
  f.frequency.setValueAtTime(o.f || 1000, at);
  if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, at + dur);
  f.Q.value = o.q || 1;
  const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, at);
  gn.gain.linearRampToValueAtTime(o.gain || .1, at + (o.attack || .004));
  gn.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(gn).connect(AC.destination);
  s.start(at, Math.random() * 1.5); s.stop(at + dur + .05);
}
function tone(f, f2, dur, gain, type, at){
  if(!AC || muted) return;
  const t0 = AC.currentTime + (at || 0);
  const o = AC.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(gain, t0 + .005); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function loopStart(f, q, gain, type){
  if(!AC || muted || loopN) return;
  const s = AC.createBufferSource(); s.buffer = NB; s.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q;
  const gn = AC.createGain(); gn.gain.value = 0.0001;
  gn.gain.linearRampToValueAtTime(gain, AC.currentTime + .3);
  s.connect(fl).connect(gn).connect(AC.destination); s.start();
  loopN = {s, gn};
}
function loopStop(){
  if(!loopN) return;
  const {s, gn} = loopN, now = AC.currentTime;
  gn.gain.cancelScheduledValues(now); gn.gain.setValueAtTime(gn.gain.value, now);
  gn.gain.linearRampToValueAtTime(0.0001, now + .12); s.stop(now + .15);
  loopN = null;
}
const sfx = {
  flint(){ noise({type:'highpass', f:3200, dur:.035, gain:.35}); noise({type:'bandpass', f:700, q:.7, dur:.45, gain:.06, attack:.05, at:.04}); },
  strike(){ noise({type:'bandpass', f:2600, f2:900, q:.8, dur:.3, gain:.3, attack:.01}); noise({type:'lowpass', f:600, dur:.6, gain:.06, attack:.1, at:.15}); },
  crackle(){ noise({type:'bandpass', f:rand(2500, 6500), q:5, dur:rand(.008, .02), gain:rand(.06, .22)}); },
  exhale(a){ noise({type:'lowpass', f:1500, f2:280, q:.6, dur:.9 + a * .45, gain:.07 + a * .02, attack:.18}); },
  cough(){ for(let i = 0; i < 3; i++) noise({type:'lowpass', f:1000, q:1.2, dur:.16, gain:.4, attack:.01, at:i * .27}); },
  flick(){ noise({type:'bandpass', f:1800, q:2, dur:.04, gain:.12}); },
  pop(){ tone(2200, 700, .05, .25, 'triangle'); noise({type:'highpass', f:3000, dur:.03, gain:.2}); },
  cut(){ noise({type:'highpass', f:3500, dur:.07, gain:.35}); tone(1400, 500, .06, .15, 'triangle'); },
  tamp(){ noise({type:'lowpass', f:420, dur:.09, gain:.35}); tone(160, 90, .08, .2); },
  knock(){ for(let i = 0; i < 2; i++){ tone(150, 90, .1, .4, 'sine', i * .18); noise({type:'lowpass', f:500, dur:.08, gain:.25, at:i * .18}); } },
  bubble(){ const f = rand(160, 420); tone(f, f * 1.7, rand(.04, .08), rand(.05, .11)); },
  buzz(n){ for(let i = 0; i < (n || 1); i++) tone(130, 120, .2, .07, 'square', i * .3); },
  place(){ noise({type:'lowpass', f:900, dur:.1, gain:.25}); noise({type:'highpass', f:5000, dur:.6, gain:.05, attack:.05, at:.05}); },
  lick(){ noise({type:'bandpass', f:1300, q:1.5, dur:.18, gain:.1, attack:.04}); },
  click(){ tone(1800, 1200, .03, .12, 'square'); },
  slide(){ noise({type:'bandpass', f:1600, f2:2600, q:1, dur:.25, gain:.08, attack:.05}); },
  clink(){ tone(3200, 2900, .25, .12, 'triangle'); tone(4700, 4500, .18, .06, 'sine'); noise({type:'highpass', f:5000, dur:.02, gain:.2}); },
  clack(){ tone(900, 500, .05, .2, 'square'); noise({type:'bandpass', f:2500, dur:.04, gain:.25}); },
  wheel(){ noise({type:'bandpass', f:2800, f2:1800, q:2, dur:.12, gain:.3}); noise({type:'lowpass', f:500, dur:.5, gain:.08, attack:.05, at:.08}); }
};

/* ================= частицы и эффекты ================= */
function smoke(x, y, o){
  E.parts.push(Object.assign({k:'smoke', x, y, vx:0, vy:-20, r:3, gr:8, a:.2, life:0, max:4, buoy:-20, drag:.4, turb:30, seed:Math.random() * 100, tint:T_SIDE}, o));
}
function sideSmoke(x, y, tint, sz){
  sz = sz || 1;
  smoke(x + rand(-1.5, 1.5) * sz, y, {vx:rand(-4, 4), vy:rand(-26, -14), r:rand(1.6, 2.8) * sz, gr:rand(5, 11) * sz, a:rand(.14, .24), max:rand(4, 6.5), buoy:-22, drag:.35, turb:rand(22, 40), tint:tint || T_SIDE});
}
function spark(x, y){
  E.parts.push({k:'spark', x, y, vx:rand(-30, 50), vy:rand(-70, -20), r:rand(.8, 1.6), gr:0, a:1, life:0, max:rand(.35, .8), buoy:220, drag:.5, turb:0, seed:0});
}
function dust(x, y, n, tint){
  for(let i = 0; i < n; i++) E.parts.push({k:'smoke', x:x + rand(-6, 6), y:y + rand(-4, 4), vx:rand(-20, 20), vy:rand(-10, 30),
    r:rand(1.5, 4), gr:rand(2, 6), a:rand(.25, .5), life:0, max:rand(.8, 1.6), buoy:60, drag:1.2, turb:10, seed:Math.random() * 100, tint:tint || T_DUST});
}
function crumb(x, y, floorY, col){
  E.parts.push({k:'crumb', x, y, vx:rand(-12, 12), vy:rand(10, 50), r:rand(1, 2.4), gr:0, a:1, life:0, max:2, buoy:700, drag:0, turb:0, seed:0, floor:floorY, col:col || '#6b4524'});
}
function floatText(str, x, y){ E.texts.push({str, x, y, life:0, max:1.7}); }
// После затяжки дым держится во рту: в это окно жест выбирает трюк, иначе обычный выдох
function exhale(amt, o){
  if(E.hold) releaseHold();
  E.hold = {amt, left:amt, o, idle:0, wait:(o.delay ?? .4) + .45, rings:0, down:null, wisp:0};
}
function releaseHold(){
  const h = E.hold; E.hold = null;
  if(h && h.left > .12) exhaleNow(h.left, h.o);
}
function exhaleNow(amt, o){
  const a = Math.min(3, amt);
  E.exh.push({left:o.dur || (.7 + a * .35), rate:(22 + a * 16) * (o.density || 1), power:Math.min(1, .35 + a / 2.5), o, acc:0});
  if(!o.silent) sfx.exhale(a);
}
function ring(x, y, dir, tint){ E.rings.push({x, y, vx:Math.cos(dir) * 120, vy:Math.sin(dir) * 120, dir, r:7, life:0, max:3.4, tint, seed:Math.random() * 10}); }
function trick(name){
  E.tricks++;
  const [x, y] = E.hold.o.mouth();
  floatText(name, x + 10, y - 40);
}
function holdGesture(dx, dy, dt){
  const h = E.hold, o = h.o, [mx, my] = o.mouth(), dist = Math.hypot(dx, dy);
  if(dist < 22 && dt < .35){
    ring(mx, my, (o.dir ?? -.38) + .1 + rand(-.08, .08), o.tint);
    noise({type:'lowpass', f:500, dur:.12, gain:.12});
    if(!h.rings) trick('Кольцо'); else E.tricks++;
    h.rings++; h.left -= .3; h.idle = 0;
    if(h.left <= .05) E.hold = null;
    return;
  }
  if(dist < 22){ releaseHold(); return; }
  const a = Math.max(.6, h.left);
  if(Math.abs(dy) > Math.abs(dx)){
    if(dy > 0){
      trick('Водопад');
      exhaleNow(a, Object.assign({}, o, {dir:Math.PI / 2 - .15, speed:.55, buoy:55, drag:1.2, turb:30, size:.8, alpha:(o.alpha || 1) * 1.2, dur:1.6, density:(o.density || 1), silent:true}));
      noise({type:'lowpass', f:700, f2:250, q:.6, dur:1.4, gain:.06, attack:.2});
    } else {
      trick('Призрак');
      for(let i = 0; i < 34; i++){
        const ang = (o.dir ?? -.38) + rand(-.25, .25), sp = rand(80, 130);
        smoke(mx + rand(-3, 3), my + rand(-3, 3), {vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp, r:rand(5, 9), gr:6, a:rand(.1, .16) * (o.alpha || 1),
          max:2.4, buoy:0, drag:2.6, turb:8, tint:o.tint || T_EXH, ghost:{back:.75, mouth:o.mouth}});
      }
      noise({type:'lowpass', f:900, dur:.3, gain:.08, attack:.05}); noise({type:'bandpass', f:1300, dur:.35, gain:.05, attack:.1, at:.75});
    }
  } else {
    trick('Дракон');
    for(const d of [Math.PI / 2 + .55, Math.PI / 2 - .55]){
      exhaleNow(a * .7, Object.assign({}, o, {dir:d, speed:1.3, size:.85, alpha:(o.alpha || 1) * 1.6, turb:25, dur:1, density:(o.density || 1) * 1.1, silent:true,
        mouth:() => { const [x, y] = o.mouth(); return [x + (d > Math.PI / 2 ? -5 : 5), y - 12]; }}));
    }
    noise({type:'lowpass', f:1800, f2:400, q:.7, dur:.9, gain:.1, attack:.05});
  }
  E.hold = null;
}
function coughFx(x, y, word, o){
  E.shake = .5; sfx.cough();
  exhaleNow(1, Object.assign({dur:1.1, density:2.4, messy:true, silent:true}, o));
  floatText(word || 'кхе-кхе', x + 20, y - 30);
}

function updateFx(dt){
  if(E.hold){
    const h = E.hold;
    if(!h.down){ h.idle += dt; if(h.idle > (h.rings ? .7 : h.wait)) releaseHold(); }
    if(E.hold && Math.random() < dt * 6){ const [mx, my] = h.o.mouth(); smoke(mx, my, {vx:rand(5, 15), vy:rand(-12, -4), r:2, gr:5, a:.12, max:1.6, buoy:-12, drag:.6, turb:20, tint:h.o.tint || T_EXH}); }
  }
  for(let i = E.exh.length - 1; i >= 0; i--){
    const e = E.exh[i], o = e.o; e.left -= dt; e.acc += dt * e.rate;
    while(e.acc > 1){
      e.acc--;
      const [mx, my] = o.mouth();
      const ang = (o.dir ?? -.38) + rand(-.28, .28) + (o.messy ? rand(-.6, .6) : 0);
      const sp = rand(140, 260) * (.55 + e.power * .45) * (o.speed || 1), sz = o.size || 1;
      smoke(mx + rand(-4, 4), my + rand(-4, 4), {vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp, r:rand(6, 12) * sz, gr:rand(30, 56) * sz,
        a:rand(.06, .12) * (o.alpha || 1), max:rand(3, 4.8), buoy:o.buoy ?? -10, drag:o.drag ?? 1.1, turb:o.turb ?? (o.messy ? 120 : 55), tint:o.tint || T_EXH});
    }

  }
  const t = E.t;

    const p = E.parts[i]; p.life += dt;
    if(p.life > p.max || p.y < -150){ E.parts.splice(i, 1); continue; }
    if(p.k === 'crumb'){
      p.vy += p.buoy * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if(p.floor !== undefined && p.y > p.floor){ E.parts.splice(i, 1); }
      continue;
    }
    if(p.ghost && p.life > p.ghost.back){
      const [mx, my] = p.ghost.mouth(), dx = mx - p.x, dy = my - p.y;
      p.vx = dx * 5; p.vy = dy * 5; p.x += p.vx * dt; p.y += p.vy * dt; p.r = Math.max(1, p.r - 14 * dt);
      if(dx * dx + dy * dy < 36) E.parts.splice(i, 1);
      continue;
    }
    if(p.turb) p.vx += Math.sin(p.y * .012 + t * .8 + p.seed) * p.turb * dt + Math.cos(p.x * .009 - t * .5 + p.seed) * p.turb * .4 * dt;
    p.vy += p.buoy * dt;
    const dr = Math.max(0, 1 - p.drag * dt); p.vx *= dr; if(p.k !== 'spark') p.vy *= dr;
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.gr * dt;
  }
  if(E.parts.length > 1100) E.parts.splice(0, E.parts.length - 1100);
  for(let i = E.chunks.length - 1; i >= 0; i--){
    const c = E.chunks[i];
    c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.ang += c.va * dt;
    if(c.land){
      const T = trayGeo();
      if(T && c.vy > 0 && c.y > T.y - T.ry * .3 && Math.abs(c.x - T.x) < T.w * .5){ landInTray(c, T); E.chunks.splice(i, 1); continue; }
    }
    if(!c.broke && c.vy > 500){ c.broke = true; if(c.dust) dust(c.x, c.y, 6, c.dust); }
    if(c.y > H + 200) E.chunks.splice(i, 1);
  }
  for(let i = E.rings.length - 1; i >= 0; i--){
    const r = E.rings[i]; r.life += dt;
    if(r.life > r.max){ E.rings.splice(i, 1); continue; }
    const dr = Math.max(0, 1 - .55 * dt); r.vx *= dr; r.vy = r.vy * dr - 6 * dt;
    r.x += r.vx * dt; r.y += r.vy * dt; r.r += (16 + 10 * r.life) * dt;
  }
  for(let i = E.texts.length - 1; i >= 0; i--){ const x = E.texts[i]; x.life += dt; x.y -= 30 * dt; if(x.life > x.max) E.texts.splice(i, 1); }

}
function drawFx(){
  for(const c of E.chunks){ g.save(); g.translate(c.x, c.y); g.rotate(c.ang); c.draw(); g.restore(); }
  for(const p of E.parts){
    const k = p.life / p.max;
    if(p.k === 'spark'){
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = `rgba(255,${150 + 80 * (1 - k) | 0},60,${1 - k})`;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();

    }

    const f = k < .08 ? k / .08 : Math.pow(1 - k, 1.4);
    g.globalAlpha = Math.max(0, p.a * f);
    g.drawImage(spr(p.tint), p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  for(const r of E.rings){
    const k = r.life / r.max, f = k < .06 ? k / .06 : Math.pow(1 - k, 1.2);
    const ux = -Math.sin(r.dir), uy = Math.cos(r.dir), vx = Math.cos(r.dir), vy = Math.sin(r.dir);

    for(let i = 0; i < n; i++){
      const a = i / n * Math.PI * 2 + Math.sin(r.life * 2 + r.seed) * .2;
      const px = r.x + ux * Math.cos(a) * r.r + vx * Math.sin(a) * r.r * .32;
      const py = r.y + uy * Math.cos(a) * r.r + vy * Math.sin(a) * r.r * .32;
      g.drawImage(s, px - sz, py - sz, sz * 2, sz * 2);
    }
  }
  g.globalAlpha = 1;
  for(const x of E.texts){
    g.globalAlpha = 1 - x.life / x.max;
    g.fillStyle = '#e9e5dd'; g.font = `500 ${Math.max(17, Math.min(26, W * .045))}px Oswald, sans-serif`;
    g.fillText(x.str, x.x, x.y);
  }
  g.globalAlpha = 1;
}
function drawBg(x, y, glow, rgb){
  g.fillStyle = '#0c0e11'; g.fillRect(0, 0, W, H);
  if(glow > .01){
    const rg = g.createRadialGradient(x, y, 0, x, y, Math.max(W, H) * .55);
    rg.addColorStop(0, `rgba(${rgb || '255,110,40'},${.13 * glow})`); rg.addColorStop(1, `rgba(${rgb || '255,110,40'},0)`);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');

/* ================= пепельница ================= */
const TRAY = load('perekur.tray', null) || {ash:0, butts:[]};
function saveTray(){ save('perekur.tray', TRAY); }
function trayGeo(){ return M && M.tray ? M.tray() : null; }
function trayAt(cx, w){ w = Math.max(110, Math.min(w, 250)); const h = w * .2, ry = w * .11; return {x:cx, y:E.bot - h - 4, w, h, ry}; }
function trayFull(){ return TRAY.butts.length >= 12 || TRAY.ash >= .95; }
function landInTray(c, T){
  if(c.ash) TRAY.ash = Math.min(1, TRAY.ash + c.ash);
  if(c.butt){
    TRAY.butts.push({t:c.butt, u:rand(-.55, .55), v:rand(-.35, .35), a:rand(0, Math.PI * 2)});
    if(TRAY.butts.length > 14) TRAY.butts.shift();
    for(let i = 0; i < 8; i++) sideSmoke(c.x + rand(-6, 6), T.y - 4, T_SIDE, 1.3);
    noise({type:'highpass', f:4000, dur:.35, gain:.05, attack:.02});
  }
  dust(c.x, T.y, c.butt ? 4 : 7, T_DUST);
  saveTray();
}
function emptyTray(){
  const T = trayGeo(); if(!T) return;
  if(!TRAY.ash && !TRAY.butts.length) return;
  dust(T.x, T.y, 20, '120,116,110');
  TRAY.ash = 0; TRAY.butts = []; saveTray();
  sfx.knock(); floatText('Вытряхнул', T.x - 40, T.y - 30);
}
function inTray(x, y){ const T = trayGeo(); return T && Math.abs(x - T.x) < T.w * .55 && y > T.y - T.ry * 1.6 && y < T.y + T.h + 6; }
// окурки: длина len, толщина d, ось по x
function drawButt(t, len, d){
  const r = d / 2;
  if(t === 'cigar'){
    g.fillStyle = vgrad(-r, r, ['#4a2e18', '#8a5c32', '#6a4322', '#2f1c0d']); g.fillRect(-len / 2, -r, len, d);
    g.fillStyle = vgrad(-r, r, ['#8a6512', '#f2d07a', '#c99a30', '#6b4a0c']); g.fillRect(-len * .2, -r, len * .22, d);
    g.fillStyle = '#2a2420'; g.fillRect(len / 2 - 3, -r, 3, d);
    return;
  }
  if(t === 'heat'){
    g.fillStyle = vgrad(-r, r, ['#d8d2c6', '#fbf8f2', '#ebe5d9', '#a9a295']); g.fillRect(-len / 2, -r, len, d);
    g.fillStyle = 'rgba(120,80,40,.55)'; g.fillRect(len * .15, -r, len * .35, d);
    return;
  }
  const tipCol = t === 'roll' ? ['#bba67a', '#eadcb9', '#d6c49a', '#9a875e'] : t === 'cigarillo' ? ['#5a3a20', '#a2714a', '#7a4e2b', '#3e2613'] : ['#9b5f29', '#e3a660', '#c27f3d', '#6f4119'];
  const tipK = t === 'cigarillo' ? 1 : .62;
  g.fillStyle = vgrad(-r, r, tipCol); g.fillRect(-len / 2, -r, len * tipK, d);
  if(tipK < 1){
    g.fillStyle = vgrad(-r, r, ['#d8d2c6', '#fbf8f2', '#ebe5d9', '#a9a295']);
    g.beginPath(); g.moveTo(-len / 2 + len * tipK, -r); g.lineTo(len / 2, -r * .6); g.lineTo(len / 2 - 2, r * .9); g.lineTo(-len / 2 + len * tipK, r); g.closePath(); g.fill();
  }
  g.fillStyle = '#2a2420'; g.fillRect(len / 2 - 3, -r * .7, 3, d * .8);
}
const BUTT_SIZE = {cigar:[.26, .07], cigarillo:[.2, .032], heat:[.2, .04]};
function drawTray(){
  const T = trayGeo(); if(!T) return;
  const {x, y, w, h, ry} = T;
  // тень и стекло
  g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(x, y + h + 2, w * .5, ry * .6, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(x - w / 2, y); g.lineTo(x - w * .42, y + h); g.ellipse(x, y + h, w * .42, ry * .6, 0, Math.PI, 0, true); g.lineTo(x + w / 2, y); g.closePath();
  g.fillStyle = 'rgba(120,140,160,.16)'; g.fill();
  g.strokeStyle = 'rgba(200,220,240,.22)'; g.lineWidth = 1; g.stroke();
  // жерло
  g.fillStyle = 'rgba(8,10,12,.7)'; g.beginPath(); g.ellipse(x, y, w * .43, ry * .8, 0, 0, Math.PI * 2); g.fill();
  g.save(); g.beginPath(); g.ellipse(x, y, w * .43, ry * .8, 0, 0, Math.PI * 2); g.clip();
  if(TRAY.ash > .01){
    const ah = ry * (.3 + TRAY.ash * 1.1);
    const ag = g.createRadialGradient(x, y + ry * .2, 0, x, y + ry * .2, w * .4);
    ag.addColorStop(0, '#9d988f'); ag.addColorStop(.6, '#6f6b65'); ag.addColorStop(1, 'rgba(70,67,63,.6)');
    g.fillStyle = ag; g.beginPath(); g.ellipse(x, y + ry * .6, w * (.18 + TRAY.ash * .22), ah, 0, 0, Math.PI * 2); g.fill();
  }
  for(const b of TRAY.butts){
    const [lk, dk] = BUTT_SIZE[b.t] || [.2, .045];
    g.save(); g.translate(x + b.u * w * .36, y + b.v * ry * .9); g.rotate(b.a); g.scale(1, .55 + .45 * Math.abs(Math.cos(b.a)));
    drawButt(b.t, w * lk, w * dk); g.restore();
  }
  g.restore();
  // ободок с выемками
  g.strokeStyle = 'rgba(210,228,245,.4)'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(x, y, w / 2, ry, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(8,10,12,.9)';
  for(const s of [-1, 1]){ g.beginPath(); g.ellipse(x + s * w * .47, y, w * .035, ry * .3, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(x - w * .25, y + h * .55, w * .05, h * .25, -.2, 0, Math.PI * 2); g.fill();
  if(trayFull()){ g.fillStyle = 'rgba(233,229,221,.55)'; g.font = '500 12px Inter, sans-serif'; g.textAlign = 'center'; g.fillText('полная, нажми, чтобы вытряхнуть', x, y - ry - 8); g.textAlign = 'start'; }
}
function glowAt(x, y, r, e, rgb){
  if(e < .02) return;
  g.globalCompositeOperation = 'lighter';
  const gl = g.createRadialGradient(x, y, 0, x, y, r);
  gl.addColorStop(0, `rgba(${rgb || '255,140,60'},${.55 * e})`); gl.addColorStop(.4, `rgba(${rgb || '255,80,20'},${.22 * e})`); gl.addColorStop(1, 'rgba(255,60,10,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';
}

/* ================= затяжка (общая) ================= */
function newP(){ return {holding:false, pressT:0, puffing:false, inhaled:0, v:0}; }
function puffTick(m, dt, can, snd){
  const P = m.P;
  if(P.holding && can && E.t - P.pressT > .16){
    if(!P.puffing){ P.puffing = true; P.inhaled = 0; if(snd) loopStart(...snd); else loopStart(1300, .8, .035); }
    P.inhaled += dt;
  }
  P.v += ((P.puffing ? 1 : 0) - P.v) * Math.min(1, dt * (P.puffing ? 3 : 2.2));
}
function pressP(m){ m.P.holding = true; m.P.pressT = E.t; }
function releaseP(m){
  const P = m.P, held = E.t - P.pressT, was = P.puffing, amt = P.inhaled;
  P.holding = false; P.puffing = false; loopStop();
  return {held, puffed:was, amt, tap:!was && held < .22};
}
function stopP(m){ m.P.holding = false; m.P.puffing = false; loopStop(); }

// спичка: головка в (x,y), палочка уходит вниз под углом ang
function drawMatch(x, y, ang, len, burnt, fl){

  g.fillStyle = '#d9b27a'; g.fillRect(-w / 2, 0, w, len);
  g.fillStyle = '#2a1a10'; g.fillRect(-w / 2, 0, w, len * burnt * .7);
  g.fillStyle = burnt > .05 ? '#1c120c' : '#8e2418';
  g.beginPath(); g.ellipse(0, 0, w * .85, w * 1.3, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  if(fl > .01){
    const fh = len * .42 * fl * (1 + Math.sin(E.t * 29) * .06);
    flame(x, y - w * .5, fh, fh * .3);
  }
}
function drawTorch(tx, ty, D, s){
  // турбо-зажигалка снизу справа, факел бьёт в (tx,ty)
  D = Math.min(D, 34);
  const nx = tx + D * 1.7, ny = ty + D * 1.1 + (1 - s) * D * 5;
  const a = Math.atan2(ty - ny, tx - nx), dist = Math.hypot(tx - nx, ty - ny);
  g.save(); g.translate(nx, ny); g.rotate(a);
  g.fillStyle = '#5d636b'; rr(-D * .1, -D * .22, D * .7, D * .44, 3); g.fill();
  g.fillStyle = '#26292e'; rr(D * .5, -D * .45, D * 2.4, D * .9, D * .2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(D * .7, -D * .35, D * 2, D * .1);
  g.fillStyle = '#8a1c1c'; rr(D * 1.6, D * .4, D * .5, D * .25, 3); g.fill();
  g.restore();
  if(s > .5){
    g.save(); g.translate(nx, ny); g.rotate(a);
    g.globalCompositeOperation = 'lighter';
    const len = dist * (.95 + Math.sin(E.t * 50) * .04);
    const jg = g.createLinearGradient(0, 0, len, 0);
    jg.addColorStop(0, 'rgba(120,170,255,.95)'); jg.addColorStop(.6, 'rgba(90,130,255,.55)'); jg.addColorStop(1, 'rgba(255,160,80,.15)');
    g.fillStyle = jg;
    g.beginPath(); g.moveTo(0, -D * .14); g.quadraticCurveTo(len * .6, -D * .12, len, 0); g.quadraticCurveTo(len * .6, D * .12, 0, D * .14); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.restore();
  }
}

/* ================= ПРЕДМЕТЫ-ПАЛОЧКИ: сигарета, самокрутка, сигарилла, сигара ================= */
const ASH_LIGHT = ['#55524e', '#a29d95', '#7d7871', '#363431'];
const ASH_CIGAR = ['#5a5753', '#aca79f', '#86817a', '#3a3734'];
function drawAsh(xs, len, D, seed, cols){
  if(len <= .5) return;
  const h = D * .96, r = rng(seed), xe = xs + len;
  g.beginPath(); g.moveTo(xs, -h / 2); g.lineTo(xe - D * .08, -h / 2);
  for(let i = 0; i <= 6; i++){
    const yy = -h / 2 + h * i / 6, bulge = Math.sin(Math.PI * i / 6) * D * .1;
    g.lineTo(Math.max(xs, xe - D * .08 + bulge - r() * D * .12), yy);
  }
  g.lineTo(xs, h / 2); g.closePath();
  g.fillStyle = vgrad(-h / 2, h / 2, cols || ASH_LIGHT); g.fill();
  g.save(); g.clip();
  const r2 = rng(seed + 11);
  for(let u = D * .3; u < len; u += D * (.3 + r2() * .35)){
    g.strokeStyle = `rgba(40,38,35,${.18 + r2() * .22})`; g.lineWidth = .8 + r2();
    g.beginPath(); const xx = xe - u; g.moveTo(xx, -h / 2);
    g.bezierCurveTo(xx + D * .08, -h / 6, xx - D * .08, h / 6, xx + r2() * D * .06, h / 2); g.stroke();
  }
  for(let i = 0; i < 9; i++){
    const yy = (r2() - .5) * h * .9, u1 = r2() * len, u2 = u1 + r2() * D * 1.5;
    g.strokeStyle = r2() < .5 ? 'rgba(235,232,226,.3)' : 'rgba(30,28,26,.25)'; g.lineWidth = .6;
    g.beginPath(); g.moveTo(xe - u1, yy); g.lineTo(Math.max(xs, xe - u2), yy + (r2() - .5) * 2); g.stroke();
  }
  g.restore();
}

const CAPS = [
  {n:'Ментол', tint:'196,236,226', stain:'rgba(70,200,165,.6)'},
  {n:'Вишня', tint:'240,206,214', stain:'rgba(200,40,80,.55)'},
  {n:'Черника', tint:'208,208,244', stain:'rgba(90,90,210,.55)'}
];

function makeRod(id, c){
  const m = {id, name:c.name, warns:c.warns || W_TOB, c};
  const r0 = rng(c.seed || 5);
  m.tex = Array.from({length:70}, () => [r0(), r0() - .5, r0(), r0()]);
  const toW = (lx, ly) => { const a = m.ang + m.wig, co = Math.cos(a), si = Math.sin(a); return [m.cx + lx * co - ly * si, m.cy + lx * si + ly * co]; };
  const toL = (x, y) => { const a = -(m.ang + m.wig), dx = x - m.cx, dy = y - m.cy, co = Math.cos(a), si = Math.sin(a); return [dx * co - dy * si, dx * si + dy * co]; };
  m.toW = toW; m.toL = toL;
  m.xb = () => m.x0 + m.L - m.burn * m.tobL;
  m.mouth = () => toW(m.x0 + (m.cut || 0) - m.D * .4, -m.D * .3);
  const LT = () => c.light === 'lighter' ? lighterId : c.light;
  m.LT = LT;
  m.tray = () => trayAt(m.cx + m.L * .2, m.L * .5);

  m.layout = () => {
    const avail = E.bot - E.top;
    const L = Math.min(W * c.wk, c.maxL, avail * 1.9);
    m.L = L; m.D = Math.max(c.minD || 12, L * c.dk * (m.thick || 1));
    m.tipL = L * c.tipK; m.tobL = L * (1 - c.tipK - (c.reserve || 0));
    m.cx = W * .5; m.cy = (E.top + E.bot) / 2 + avail * .05;
    m.x0 = -L / 2 - L * .03; m.ang = -.07;
  };
  m.reset = () => {
    Object.assign(m, {lit:false, done:false, burn:0, ash:0, ashMax:rand(...c.ash), ashSeed:(Math.random() * 1e9) | 0,
      ember:0, lighting:0, sinceLit:9, flame:0, smolder:0, puffs:0, litTime:0, wig:0, wigV:0, carry:0, endIn:-1,
      drawF:1, burnF:1, coughF:1, thick:1, crook:0, cut:0, maxAsh:0, P:newP(),
      match:{on:false, life:0, outIn:-1}, caps:c.capsule ? {crushed:false, f:pick(CAPS)} : null,
      sideTint:c.side || T_SIDE, exhTint:c.exh || T_EXH, fire:0, lid:0, lidOpen:false, misfire:false, gone:false, cheapCol:pick(CHEAP_COLS),
      phase:c.prep ? c.prep.start : 'ready'});
    if(c.prep && c.prep.init) c.prep.init(m);
    m.layout();
  };
  function light(){ m.lit = true; m.sinceLit = 0; if(c.light === 'torch') loopStop(); }
  function dropMatch(){
    const mt = m.match; if(!mt.on) return;
    mt.on = false;
    const [tx, ty] = toW(m.xb(), 0), D = m.D, len = D * 2.6, burnt = Math.min(1, mt.life / 7);
    E.chunks.push({x:tx + D * .45, y:ty + D * .95, vx:rand(-20, 20), vy:0, ang:0, va:rand(-3, 3), broke:true,
      draw(){ drawMatch(0, 0, -.5, len, Math.max(burnt, .6), 0); }});
  }
  function dropAsh(flicked){
    const [x, y] = toW(m.xb(), 0), len = m.ash * m.L, D = m.D, seed = m.ashSeed, cols = c.ashCols, T = m.tray();
    const aim = T ? (T.x - x - len / 2) * .9 : 0;
    E.chunks.push({x, y, ang:m.ang + m.wig + droop(), vx:aim + (flicked ? rand(10, 40) : rand(-5, 10)), vy:flicked ? rand(30, 90) : 0,
      va:rand(.5, 2.5) * (Math.random() < .5 ? -1 : 1), broke:false, dust:T_DUST, land:true, ash:m.ash * .35, draw(){ drawAsh(0, len, D, seed, cols); }});
    m.ash = 0; m.ashSeed = (Math.random() * 1e9) | 0; m.ashMax = rand(...c.ash);
  }
  const droop = () => Math.min(.16, m.ash * m.ash * 2.6 * (c.stiff || 1));
  function flick(){
    m.wigV += 1.4; sfx.flick();
    if(m.ash > .015) dropAsh(true);
    else { const [x, y] = toW(m.xb(), 0); dust(x, y, 4); }
  }
  function finish(){
    m.lit = false; m.done = true; stopP(m);
    if(m.ash > .01) dropAsh(false);
    // тушим и бросаем окурок в пепельницу
    const T = m.tray(), stub = Math.max(m.tipL, m.L * .12) + m.D * .8, mid = m.x0 + stub / 2;
    const [x, y] = toW(mid, 0), D = m.D, bt = c.butt;
    m.gone = true;
    E.chunks.push({x, y, ang:m.ang, vx:T ? (T.x - x) * 1.1 : 0, vy:-60, va:rand(-2, 2), broke:true, land:true, butt:bt, draw(){ drawButt(bt, stub, D); }});
    bump(m.id);
    m.endIn = 1.6;
  }

  m.down = (x, y) => {
    if(m.done) return;
    audio();
    if(m.phase !== 'ready'){ c.prep.down(m, x, y); return; }
    const lt = LT();
    if(!m.lit && lt === 'petrol' && !m.lidOpen){ m.lidOpen = true; sfx.clink(); return; }
    pressP(m);
    if(!m.lit){
      m.misfire = false;
      if(lt === 'piezo') sfx.flint();
      else if(lt === 'cheap'){
        sfx.flint();
        if(Math.random() < .4){
          m.misfire = true;
          const [tx, ty] = toW(m.xb() + m.D * .2, m.D * .5);
          for(let i = 0; i < 6; i++) spark(tx, ty + m.D * 1.2);
          if(Math.random() < .5) floatText('Осечка', tx + 10, ty + m.D * 2.5);
        }
      }
      else if(lt === 'petrol') sfx.wheel();
      else if(lt === 'candle') sfx.flint();
      else if(lt === 'torch'){ sfx.flint(); loopStart(2400, .5, .05, 'highpass'); }
      else if(lt === 'match' && !m.match.on){ m.match = {on:true, life:0, outIn:-1}; sfx.strike(); }
    }
  };
  m.move = (x, y) => { if(m.phase !== 'ready' && c.prep.move) c.prep.move(m, x, y); };
  m.up = (x, y) => {
    if(m.phase !== 'ready'){ c.prep.up(m, x, y); return; }
    if(!m.P.holding) return;
    const r = releaseP(m);
    if(r.puffed){
      if(r.amt > .25) addPuff(m);
      const mouthy = c.mouthy;
      exhale(Math.max(.2, r.amt) * m.drawF, {delay:mouthy ? .2 : .4, mouth:m.mouth, tint:m.exhTint, density:c.density || 1, size:c.size || 1, alpha:c.alpha || 1});
    } else if(r.tap && m.lit){
      if(m.caps && !m.caps.crushed && x !== undefined){
        const [lx, ly] = toL(x, y);
        if(lx > m.x0 - m.D * .5 && lx < m.x0 + m.tipL && Math.abs(ly) < m.D * 1.6){ crush(); return; }
      }
      flick();
    } else if(r.tap && !m.lit && m.caps && !m.caps.crushed && x !== undefined){
      const [lx, ly] = toL(x, y);
      if(lx > m.x0 - m.D * .5 && lx < m.x0 + m.tipL && Math.abs(ly) < m.D * 1.6) crush();
    }
  };
  function crush(){
    const k = m.caps; k.crushed = true; sfx.pop(); m.wigV += .6;
    m.exhTint = k.f.tint; m.sideTint = k.f.tint;
    const [x, y] = toW(m.x0 + m.tipL * .5, -m.D);
    floatText('Щёлк! ' + k.f.n, x - 30, y - 10);
  }
  m.key = k => { if(k === 'f' && m.lit && m.phase === 'ready') flick(); };

  m.update = dt => {
    if(m.phase !== 'ready'){ c.prep.update(m, dt); return; }
    const P = m.P;
    // прикуривание
    const lt = LT();
    if(!m.lit && !m.done){
      if(lt === 'match'){
        if(P.holding && m.match.on){ m.lighting += dt; if(m.lighting > LTIME.match){ light(); m.match.outIn = .5; } }
        else if(!P.holding) m.lighting = 0;
      } else {
        if(P.holding && !m.misfire){
          m.lighting += dt;
          if(lt === 'candle' && Math.random() < dt * 16){ const [tx, ty] = toW(m.xb(), 0); smoke(tx + rand(-3, 3), ty - 4, {vx:rand(-5, 5), vy:-30, r:2, gr:7, a:.4, max:2.5, buoy:-25, drag:.4, turb:20, tint:'34,30,28'}); }
          if(m.lighting > LTIME[lt]) light();
        }
        else if(!P.holding) m.lighting = 0;
      }
    }
    if(m.match.on){
      m.match.life += dt;
      if(m.match.life > 7) dropMatch();
      if(m.match.outIn > 0){ m.match.outIn -= dt; if(m.match.outIn <= 0) dropMatch(); }
    }
    m.sinceLit += dt;
    if(lt === 'petrol' && m.lidOpen && m.lit && m.sinceLit > .8){ m.lidOpen = false; sfx.clack(); }
    m.lid += ((m.lidOpen ? 1 : 0) - m.lid) * Math.min(1, dt * 14);
    const fireOn = lt !== 'match' && P.holding && !m.misfire && !m.done && (!m.lit || m.sinceLit < .35) && (lt !== 'petrol' || m.lid > .9);
    const visOn = lt !== 'match' && !m.done && ((P.holding && (!m.lit || m.sinceLit < .35)) || (lt === 'petrol' && (m.lidOpen || m.lid > .05)));
    m.fire += ((fireOn ? 1 : 0) - m.fire) * Math.min(1, dt * (fireOn ? 9 : 10));
    m.flame += ((visOn ? 1 : 0) - m.flame) * Math.min(1, dt * (visOn ? 9 : 6));

    puffTick(m, dt, m.lit && !m.done);
    if(P.puffing && P.inhaled > c.cough * m.coughF){
      stopP(m); addPuff(m);
      const [x, y] = toW(m.x0, -m.D);
      coughFx(x, y, 'кхе-кхе', {mouth:m.mouth, tint:m.exhTint});
    }
    if(m.lit){
      const d = (c.burnIdle + P.v * c.burnPuff * m.burnF) * dt;
      m.burn += d; m.ash += d * (m.tobL / m.L) * .93; m.litTime += dt;
      m.maxAsh = Math.max(m.maxAsh, m.ash);
      if(m.ash > m.ashMax) dropAsh(false);
      if(m.burn >= 1){ m.burn = 1; finish(); }
      if(Math.random() < dt * (1.2 + P.v * 22)) sfx.crackle();
      if(P.v > .3 && Math.random() < dt * 7 * P.v * (1 + m.crook * 3)) { const [x, y] = toW(m.xb() + m.D * .05, rand(-.4, .3) * m.D); spark(x, y); }
    }
    const flick = .06 * Math.sin(E.t * 13.1) + .05 * Math.sin(E.t * 7.3 + 1) + .04 * Math.sin(E.t * 23.7);
    let target = m.lit ? .38 + .62 * P.v + flick : 0;
    if(!m.lit && lt === 'torch' && m.lighting > 0) target = m.lighting / LTIME.torch * .7;
    if(!m.lit && lt === 'candle' && m.lighting > 0) target = m.lighting / LTIME.candle * .5;
    m.ember += (target - m.ember) * Math.min(1, dt * (m.lit || m.lighting ? 8 : 1.5));
    if(m.lit || m.smolder > 0){
      const k = m.lit ? 1 - .65 * P.v : m.smolder / 3.5;
      m.carry += dt * (c.sideRate || 34) * k;
      while(m.carry > 1){ m.carry--; const [x, y] = toW(m.xb() + m.D * .1, -m.D * .45); sideSmoke(x, y, m.sideTint, c.sideSize || 1); }
    }
    if(m.smolder > 0) m.smolder -= dt;
    m.wigV += (-m.wig * 400 - m.wigV * 12) * dt; m.wig += m.wigV * dt;
    if(m.endIn > 0){ m.endIn -= dt; if(m.endIn <= 0) c.end(m); }
  };

  /* ---- рисование ---- */
  function bodyPath(a, b, R){
    g.beginPath();
    if(!m.crook){ g.rect(a, -R, b - a, R * 2); return; }
    const amp = m.D * .07 * m.crook, s = c.seed || 1;
    const n = Math.max(2, Math.ceil((b - a) / 8));
    for(let i = 0; i <= n; i++){ const x = a + (b - a) * i / n; const y = -R + Math.sin(x * .045 + s) * amp + Math.sin(x * .11) * amp * .5; i ? g.lineTo(x, y) : g.moveTo(x, y); }
    for(let i = n; i >= 0; i--){ const x = a + (b - a) * i / n; const y = R + Math.sin(x * .05 + s * 2) * amp - Math.sin(x * .13) * amp * .4; g.lineTo(x, y); }
    g.closePath();
  }
  m.drawRod = (alpha) => {
    const D = m.D, R = D / 2, xs = m.x0 + m.cut, xt = m.x0 + m.tipL, xe = m.x0 + m.L, xb = m.xb();
    const sx = E.shake > 0 ? rand(-1, 1) * E.shake * 8 : 0, sy = E.shake > 0 ? rand(-1, 1) * E.shake * 6 : 0;
    g.save(); g.translate(m.cx + sx, m.cy + sy); g.rotate(m.ang + m.wig);
    if(alpha !== undefined) g.globalAlpha = alpha;
    // тень
    g.fillStyle = 'rgba(0,0,0,.35)';
    g.beginPath(); g.ellipse((xs + xb) / 2, R * 2.6, Math.max(1, (xb - xs) / 2), R * .5, 0, 0, Math.PI * 2); g.fill();

    // тело
    const bodyA = c.tip === 'cap' ? xs : xt;
    if(xb > bodyA){
      bodyPath(bodyA, xb, R);
      g.fillStyle = vgrad(-R, R, c.body); g.fill();
      g.save(); bodyPath(bodyA, xb, R); g.clip();
      if(c.tex === 'leaf'){
        for(const [u, v, a, l] of m.tex){
          const x = bodyA + u * (m.L * 1.05);
          if(x > xb) continue;
          g.strokeStyle = a < .5 ? 'rgba(20,10,4,.22)' : 'rgba(255,220,170,.12)'; g.lineWidth = .7 + l;
          g.beginPath(); g.moveTo(x, -R); g.quadraticCurveTo(x + D * (v * 1.4), 0, x + D * (a - .5) * 1.2, R); g.stroke();
        }
      } else if(c.tex === 'roll'){
        for(const [u, v, a] of m.tex){
          const x = bodyA + u * (m.L * .95); if(x > xb) continue;
          g.fillStyle = `rgba(110,70,30,${.12 + a * .18})`; g.fillRect(x, v * D * .9, 2 + a * 4, 1.2);
        }
        g.strokeStyle = 'rgba(120,100,70,.25)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(bodyA, -R * .35); g.lineTo(xb, -R * .3); g.stroke();
      }
      g.restore();
      if(c.brand && xb > xt + D * .5){
        g.save(); g.beginPath(); g.rect(xt, -R, Math.max(0, xb - xt - D * .3), D); g.clip();
        g.fillStyle = 'rgba(70,60,50,.32)'; g.font = `600 ${Math.max(7, D * .26)}px Oswald, sans-serif`;
        g.textBaseline = 'middle'; g.fillText('П Е Р Е К У Р', xt + D * .5, -R * .05);
        g.restore();
      }
    }
    // мундштук / фильтр
    if(c.tip === 'cork'){
      g.fillStyle = vgrad(-R, R, ['#9b5f29', '#e3a660', '#c27f3d', '#6f4119']); g.fillRect(m.x0, -R, m.tipL, D);
      for(const [u, v, a, l] of m.tex){ g.fillStyle = l < .7 ? 'rgba(90,48,14,.45)' : 'rgba(255,220,170,.35)'; g.fillRect(m.x0 + u * m.tipL, v * D * .95, .4 + a * 1.1, .4 + a * 1.1); }
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(m.x0, -R, 2, D);
      g.fillStyle = '#d8b45a'; g.fillRect(xt - m.tipL * .05, -R, 1.6, D);
      if(m.caps){
        const cx = m.x0 + m.tipL * .45;
        if(m.caps.crushed){
          const sg = g.createRadialGradient(cx, 0, 0, cx, 0, D * .7);
          sg.addColorStop(0, m.caps.f.stain); sg.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = sg; g.fillRect(cx - D * .8, -R, D * 1.6, D);
        } else {
          g.strokeStyle = 'rgba(70,35,10,.45)'; g.lineWidth = 1;
          g.beginPath(); g.arc(cx, 0, D * .2, 0, Math.PI * 2); g.stroke();
          g.fillStyle = 'rgba(255,230,190,.25)'; g.beginPath(); g.arc(cx - D * .06, -D * .06, D * .07, 0, Math.PI * 2); g.fill();
        }
      }
    } else if(c.tip === 'wood'){
      const r = R * .9;
      g.fillStyle = vgrad(-r, r, ['#8a6a3c', '#e2c28c', '#c29d63', '#6a4d26']);
      rr(m.x0, -r, m.tipL + 2, r * 2, r * .5); g.fill();
      g.strokeStyle = 'rgba(90,60,25,.35)'; g.lineWidth = .8;
      for(let i = 0; i < 4; i++){ const yy = -r * .6 + i * r * .4; g.beginPath(); g.moveTo(m.x0 + 4, yy); g.bezierCurveTo(m.x0 + m.tipL * .3, yy + 2, m.x0 + m.tipL * .6, yy - 2, xt, yy + 1); g.stroke(); }
      g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(xt - 1, -R, 2, D);
    } else if(c.tip === 'crutch'){
      bodyPath(m.x0, xt, R);
      g.fillStyle = vgrad(-R, R, ['#bba67a', '#eadcb9', '#d6c49a', '#9a875e']); g.fill();
      g.save(); bodyPath(m.x0, xt, R); g.clip();
      g.strokeStyle = 'rgba(120,95,55,.45)'; g.lineWidth = 1;
      for(let x = m.x0 - D; x < xt; x += D * .35){ g.beginPath(); g.moveTo(x, R); g.lineTo(x + D * .6, -R); g.stroke(); }
      g.restore();
      g.fillStyle = 'rgba(60,40,20,.35)'; g.beginPath(); g.ellipse(m.x0, 0, D * .08, R * .9, 0, 0, Math.PI * 2); g.fill();
    } else if(c.tip === 'cap'){
      if(!m.cut){
        g.fillStyle = vgrad(-R, R, c.body);
        g.beginPath(); g.ellipse(xs, 0, R * .55, R, 0, Math.PI / 2, Math.PI * 1.5); g.fill();
      } else {
        g.fillStyle = '#5a3c22'; g.beginPath(); g.ellipse(xs, 0, D * .1, R * .96, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(30,15,5,.6)'; for(let i = 0; i < 6; i++){ g.fillRect(xs - 2 + Math.random() * 3, -R * .8 + i * R * .3, 2, 2); }
      }
      // кольцо сигары
      const b0 = m.x0 + m.L * .07, b1 = m.x0 + m.L * .14;
      g.fillStyle = vgrad(-R, R, ['#8a6512', '#f2d07a', '#c99a30', '#6b4a0c']); g.fillRect(b0, -R - .5, b1 - b0, D + 1);
      g.fillStyle = vgrad(-R * .6, R * .6, ['#5a0d12', '#c22a35', '#8e1520', '#3e070b']);
      g.beginPath(); g.ellipse((b0 + b1) / 2, 0, (b1 - b0) * .34, R * .62, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,230,160,.85)'; g.font = `600 ${Math.max(6, R * .32)}px Oswald, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('П', (b0 + b1) / 2, 0); g.textAlign = 'start';
    }

    // обугленный край
    if(xb > bodyA && m.burn > 0){
      const cw = D * .45, pts = [];
      for(let i = 0; i <= 8; i++) pts.push([xb - D * (.12 + .1 * (Math.sin(i * 1.9 + m.burn * 37) * .5 + .5)), -R + D * i / 8]);
      g.beginPath(); g.moveTo(xb - cw, -R); g.lineTo(xb, -R); g.lineTo(xb, R); g.lineTo(xb - cw, R); g.closePath();
      const cg = g.createLinearGradient(xb - cw, 0, xb, 0);
      cg.addColorStop(0, 'rgba(150,110,60,0)'); cg.addColorStop(.45, 'rgba(120,80,40,.35)'); cg.addColorStop(1, 'rgba(60,36,18,.6)');
      g.fillStyle = cg; g.fill();
      g.beginPath(); g.moveTo(xb, -R); for(const [px, py] of pts) g.lineTo(px, py); g.lineTo(xb, R); g.closePath();
      g.fillStyle = '#20140b'; g.fill();
      if(m.ember > .02){
        g.strokeStyle = `rgba(255,${120 + 60 * m.ember | 0},60,${.25 + .6 * m.ember})`; g.lineWidth = 1.2;
        g.beginPath(); pts.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
      }
    }
    // торец
    if(!m.lit && !m.done && m.burn === 0){
      if(c.twist){
        g.fillStyle = vgrad(-R, R, c.body);
        g.beginPath(); g.moveTo(xe, -R * .8); g.quadraticCurveTo(xe + D * .3, -R * .3, xe + D * .55, -R * .1);
        g.lineTo(xe + D * .62, R * .15); g.quadraticCurveTo(xe + D * .3, R * .3, xe, R * .8); g.closePath(); g.fill();
      } else {
        g.fillStyle = c.footCol || '#6b4220'; g.fillRect(xe - 2, -R, 3, D);
        const r = rng(3); g.fillStyle = '#3d230f';
        for(let i = 0; i < 10; i++) g.fillRect(xe - 1 + r() * 2.5, -R + r() * D, 1.5, 1.5);
      }
    }
    if(m.burn > 0 || m.ember > .02){
      const e = m.ember;
      g.beginPath(); g.ellipse(xb, 0, D * .14, R * .98, 0, -Math.PI / 2, Math.PI / 2);
      const fg = g.createRadialGradient(xb, 0, 0, xb, 0, R);
      fg.addColorStop(0, `rgb(255,${150 + 90 * e | 0},${60 + 120 * e * e | 0})`);
      fg.addColorStop(.6, `rgb(${120 + 135 * e | 0},${30 + 60 * e | 0},10)`);
      fg.addColorStop(1, `rgb(${40 + 60 * e | 0},20,12)`);
      g.fillStyle = e > .02 ? fg : '#2a2522'; g.fill();
    }
    if(m.ash > 0){
      g.save(); g.translate(xb, 0); g.rotate(droop());
      drawAsh(0, m.ash * m.L, D, m.ashSeed, c.ashCols);
      if(m.ember > .02){
        const ag = g.createLinearGradient(0, 0, D * .55, 0);
        ag.addColorStop(0, `rgba(255,${90 + 80 * m.ember | 0},30,${.85 * m.ember})`); ag.addColorStop(1, 'rgba(255,90,30,0)');
        g.fillStyle = ag; g.fillRect(0, -R * .96, Math.min(D * .55, m.ash * m.L), D * .96);
      }
      g.restore();
    }
    if(m.ember > .02){ g.fillStyle = `rgb(255,${120 + 100 * m.ember | 0},${50 + 80 * m.ember | 0})`; g.fillRect(xb - 1.5, -R, 3, D); }
    g.restore();
    const [ex, ey] = toW(xb, 0);
    glowAt(ex, ey, D * (1 + m.ember * 1.6), m.ember);
  };
  m.draw = () => {
    const [ex, ey] = toW(m.xb(), 0);
    drawBg(ex, ey, m.ember);
    if(m.phase !== 'ready'){ c.prep.draw(m); return; }
    if(!m.gone) m.drawRod();
    // инструмент
    const lt = LT(), [tx, ty] = toW(m.xb() + m.D * .2, m.D * .5), Dt = Math.min(m.D, 52);
    if(m.flame > .01){
      if(lt === 'piezo') drawPiezo(tx, ty + Dt * 1.2, Dt, m.flame, m.fire);
      if(lt === 'cheap') drawCheap(tx, ty + Dt * 1.35, Dt, m.flame, m.fire, m.cheapCol);
      if(lt === 'petrol') drawPetrol(tx, ty + Dt * 1.55, Dt, m.flame, m.fire, m.lid);
      if(lt === 'candle') drawCandle(tx, ty + Dt * 1.6, Dt, m.flame, m.fire);
      if(lt === 'torch') drawTorch(tx + m.D * .1, ty - m.D * .4, m.D, m.flame);
    }
    if(lt === 'match' && m.match.on){
      const life = m.match.life, fl = life > 6 ? Math.max(0, 7 - life) : Math.min(1, life * 6);
      const len = m.D * 2.6;
      drawMatch(tx + m.D * .25, ty + m.D * .35, -.5, len, Math.min(1, life / 7), fl);
    }
  };
  m.hint = () => {
    if(m.phase !== 'ready') return c.prep.hint(m);
    if(m.done) return '';
    if(!m.lit){
      const lt = LT();
      if(lt === 'match') return m.match.on ? (m.P.holding ? 'Держи у кончика…' : 'Спичка горит. Зажми, чтобы прикурить') : 'Нажми, чтобы чиркнуть спичкой';
      if(lt === 'torch') return m.P.holding ? 'Прогреваю кончик…' : 'Зажми, чтобы раскурить горелкой';
      if(lt === 'petrol' && !m.lidOpen) return 'Нажми, чтобы откинуть крышку';
      if(lt === 'cheap' && m.misfire) return 'Осечка. Отпусти и чиркни ещё раз';
      if(lt === 'candle') return m.P.holding ? 'От свечи раскуривается медленно, держи…' : 'Зажми, чтобы прикурить от свечи';
      return m.P.holding ? 'Держи…' : 'Зажми, чтобы прикурить';
    }
    if(m.P.puffing) return m.P.inhaled > c.cough * m.coughF * .7 ? 'Хватит, хватит' : 'Затяжка…';
    if(m.ash > m.ashMax * .8) return 'Пепел сейчас упадёт. Коротко нажми, чтобы стряхнуть';
    if(m.caps && !m.caps.crushed) return 'Зажми, чтобы затянуться · нажми на фильтр, чтобы раздавить кнопку';
    return c.hintLit || 'Зажми, чтобы затянуться · нажми коротко, чтобы стряхнуть';
  };
  m.stats = () => c.stats(m);
  return m;
}

function openDiary(confirmReset){
  if(M && M.P) stopP(M);
  let sp = 0, sd = 0;
  const rows = ORDER.map(id => {
    const p = puffTotals[id] || 0, d = DIARY_UNITS[id] ? (totals[id] || 0) : null;

    return `<tr><td>${MODES[id].name}</td><td class="${p ? '' : 'zero'}">${p}</td><td class="${d ? '' : 'zero'}">${d === null ? '—' : d}</td></tr>`;
  }).join('');

    <div style="overflow-x:auto"><table class="dtable"><thead><tr><th>Что</th><th>Затяжек</th><th>Докурено</th></tr></thead>
    <tbody>${rows}<tr class="sum"><td>Всего</td><td>${sp}</td><td>${sd}</td></tr></tbody></table></div>
    <p>Электронку не докуривают до конца, поэтому у неё только затяжки. Счёт хранится в этом браузере.</p>
    <div class="row">${confirmReset
      ? `<button class="btn primary" id="dYes" type="button">Да, стереть</button><button class="btn" id="dNo" type="button">Отмена</button>`
      : `<button class="btn primary" id="dClose" type="button">Закрыть</button><button class="btn" id="dReset" type="button">Обнулить</button>`}</div>`;
  $('diary').hidden = false;
  if(confirmReset){
    $('dYes').addEventListener('click', () => {
      for(const k of Object.keys(puffTotals)) delete puffTotals[k];
      for(const k of Object.keys(totals)) delete totals[k];
      save('perekur.puffs', puffTotals); save('perekur.totals', totals); lastHud = '';
      openDiary(false);
    });
    $('dNo').addEventListener('click', () => openDiary(false));
    $('dNo').focus();
  } else {
    $('dClose').addEventListener('click', () => { $('diary').hidden = true; });
    $('dReset').addEventListener('click', () => openDiary(true));
    $('dClose').focus();
  }
}

/* ---- самокрутка ---- */
const N_BINS = 14;
const rollPrep = {
  start:'pour',
  init(m){
    const r = rng(77);
    m.roll = {bins:new Array(N_BINS).fill(0), prog:0, lastY:null, holding:false, strands:Array.from({length:N_BINS * 64}, () => [r(), r(), r() * Math.PI, 5 + r() * 9, r()]), sealT:0};
    m.phase = 'pour';
  },
  geo(m){ const PW = m.L * .9, PH = m.L * .34; return {PW, PH, x:m.cx - PW / 2, y:m.cy - PH / 2}; },
  stat(m){
    const b = m.roll.bins, avg = b.reduce((a, v) => a + v, 0) / b.length;
    const sd = Math.sqrt(b.reduce((a, v) => a + (v - avg) * (v - avg), 0) / b.length);
    return {avg, even:avg > 0 ? clamp(1 - sd / avg, 0, 1) : 0};
  },
  down(m, x, y){
    const R = m.roll; R.holding = true; R.lastY = y;
    R.kb = x === undefined; // с клавиатуры: табак сыплется сам, проходя вдоль бумаги
    R.kbT = 0;
    if(m.phase === 'pour') loopStart(3200, .7, .02);
    if(m.phase === 'lick'){
      sfx.lick(); m.phase = 'sealing'; R.sealT = 0;
    }
  },
  move(m, x, y){
    const R = m.roll;
    if(R.holding && m.phase === 'roll' && R.lastY !== null){
      const gm = rollPrep.geo(m); R.prog = Math.min(1, R.prog + Math.abs(y - R.lastY) / (gm.PH * 2.2));
    }
    R.lastY = y;
  },
  up(m){
    const R = m.roll; R.holding = false; loopStop();
    if(m.phase === 'pour'){
      const s = rollPrep.stat(m);
      if(s.avg >= .85) m.phase = 'roll';
    }
  },
  update(m, dt){
    const R = m.roll, gm = rollPrep.geo(m);
    if(m.phase === 'pour' && R.holding){
      if(R.kb) R.kbT += dt;
      const px = R.kb ? gm.x + gm.PW * (1 - Math.abs((R.kbT * .7) % 2 - 1)) : E.px;
      const py = R.kb ? m.cy - gm.PH * .6 : E.py;
      const u = (px - gm.x) / gm.PW;
      if(u >= -.05 && u <= 1.05){
        const fi = clamp(u, 0, .999) * N_BINS;
        for(let i = 0; i < N_BINS; i++){ const d = i + .5 - fi; R.bins[i] = Math.min(2.6, R.bins[i] + dt * 2.2 * Math.exp(-d * d / 1.2)); }
        if(Math.random() < dt * 40) crumb(px + rand(-8, 8), py - 10, m.cy + rand(-gm.PH * .3, gm.PH * .3));
      }
    }
    if(m.phase === 'roll' && R.holding) R.prog = Math.min(1, R.prog + dt * .3);
    if(m.phase === 'roll' && R.prog >= 1){ m.phase = 'lick'; R.holding = false; }
    if(m.phase === 'sealing'){
      R.sealT += dt;
      if(R.sealT > .5){
        const s = rollPrep.stat(m);
        m.thick = clamp(Math.sqrt(s.avg), .82, 1.3);
        m.crook = clamp(1 - s.even, 0, 1) * 1.6;
        m.burnF = 1 + m.crook * .8;
        m.drawF = s.avg > 1.5 ? .65 : 1;
        m.coughF = s.avg > 1.5 ? .8 : 1;
        m.layout();
        const word = s.avg > 1.5 ? 'Туго набита' : s.even > .82 ? 'Ровно скручено' : s.even > .6 ? 'Сойдёт' : 'Кривовато';
        floatText(word, m.cx - 50, m.cy - m.D * 2);
        m.phase = 'ready';
      }
    }
  },
  draw(m){
    const R = m.roll, gm = rollPrep.geo(m), k = R.prog, e = k * k * (3 - 2 * k);
    const D = m.L * .08 * clamp(Math.sqrt(Math.max(.5, rollPrep.stat(m).avg)), .82, 1.3);
    const h = lerp(gm.PH, D, e), y0 = m.cy - h / 2;
    // бумага
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(m.cx, m.cy + h / 2 + 18, gm.PW / 2, 8, 0, 0, Math.PI * 2); g.fill();
    if(k < .02){
      g.fillStyle = '#efe9dc'; g.fillRect(gm.x, y0, gm.PW, h);
      g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(gm.x, y0, gm.PW, 3);
      g.fillStyle = 'rgba(210,190,140,.5)'; g.fillRect(gm.x, y0 + 2, gm.PW, h * .08);
    } else {
      g.fillStyle = vgrad(y0, y0 + h, ['#d6cfbf', '#f1ebdd', '#e2dac9', '#a69c88']); g.fillRect(gm.x, y0, gm.PW, h);
      g.strokeStyle = 'rgba(120,100,70,.3)'; g.lineWidth = 1; g.beginPath(); g.moveTo(gm.x, y0 + h * .35); g.lineTo(gm.x + gm.PW, y0 + h * .32); g.stroke();
    }
    // табак
    const binW = gm.PW / N_BINS;
    g.save(); g.beginPath(); g.rect(gm.x, y0, gm.PW, h); g.clip();
    for(let i = 0; i < N_BINS; i++){
      const b = R.bins[i];
      if(b > .02){
        const bh = lerp(gm.PH * .4 * Math.min(1.4, .6 + b * .4), h * .8, e) * .8;
        g.fillStyle = `rgba(110,68,32,${Math.min(.85, b * .55) * (k > .02 ? lerp(1, .3, e) : 1)})`;
        rr(gm.x + i * binW - 1, m.cy - bh / 2, binW + 2, bh, bh * .3); g.fill();
      }
    }
    for(let i = 0; i < N_BINS; i++){
      const n = Math.min(64, Math.floor(R.bins[i] * 28));
      for(let j = 0; j < n; j++){
        const [u, v, a, l, c] = R.strands[i * 64 + j];
        const sx = gm.x + (i + u) * binW, sy = m.cy + (v - .5) * lerp(gm.PH * .4 * Math.min(1.4, .6 + R.bins[i] * .4), h * .8, e);
        g.strokeStyle = c < .33 ? '#6b4524' : c < .66 ? '#8a5a2e' : '#4f3218';
        g.globalAlpha = k > .02 ? lerp(1, .25, e) : 1;
        g.lineWidth = 1.7; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a) * l, sy + Math.sin(a) * l * .5); g.stroke();
      }
    }
    g.globalAlpha = 1; g.restore();
    if(m.phase === 'lick' || m.phase === 'sealing'){
      const a = m.phase === 'sealing' ? clamp(R.sealT * 2, 0, 1) : .3 + .2 * Math.sin(E.t * 4);
      g.strokeStyle = `rgba(200,220,255,${a})`; g.lineWidth = 2;
      g.beginPath(); g.moveTo(gm.x, y0 + h * .2); g.lineTo(gm.x + gm.PW, y0 + h * .2); g.stroke();
    }
    // полоска уровня
    if(m.phase === 'pour'){
      const s = rollPrep.stat(m), bw = gm.PW, by = m.cy + gm.PH / 2 + 34;
      g.fillStyle = 'rgba(233,229,221,.12)'; g.fillRect(gm.x, by, bw, 4);
      g.fillStyle = s.avg > 1.5 ? '#ff6a1f' : '#e9e5dd'; g.fillRect(gm.x, by, bw * clamp(s.avg / 2, 0, 1), 4);
      g.fillStyle = 'rgba(120,220,140,.8)'; g.fillRect(gm.x + bw * .425, by - 3, 2, 10); g.fillRect(gm.x + bw * .75, by - 3, 2, 10);
    }
  },
  hint(m){
    if(m.phase === 'pour'){
      const s = rollPrep.stat(m);
      if(s.avg < .05) return 'Зажми и веди пальцем вдоль бумаги: насыпь табак';
      return `Табак: ${Math.round(s.avg * 100)}%, ровность ${Math.round(s.even * 100)}%. ${s.avg >= .85 ? 'Отпусти, чтобы скручивать' : 'Сыпь ровнее по всей длине'}`;
    }
    if(m.phase === 'roll') return 'Води пальцем вверх-вниз: скручивай';
    if(m.phase === 'lick' || m.phase === 'sealing') return 'Нажми, чтобы лизнуть край и заклеить';
    return '';
  }
};
MODES.roll = makeRod('roll', {

  burnIdle:1 / 200, burnPuff:1 / 18, cough:3.0, ash:[.1, .2], light:'lighter', prep:rollPrep,
  stats:m => [['Затяжек', m.puffs], ['Скручено', totals.roll || 0], ['Жизни', fmtLife(cigLife())]],

});

  name:'Сигарилла', butt:'cigarillo', wk:.7, maxL:540, dk:.062, tipK:.2, tip:'wood', tex:'leaf', seed:3, reserve:.02, mouthy:true,
  body:['#5a3a20', '#a2714a', '#7a4e2b', '#3e2613'], footCol:'#4a2c14',
  burnIdle:1 / 300, burnPuff:1 / 26, cough:2.0, ash:[.14, .26], ashCols:ASH_CIGAR, light:'match',
  side:'168,176,196', exh:'206,198,188', density:1.3,
  hintLit:'Не в затяг: короткие затяжки · нажми коротко, чтобы стряхнуть',
  stats:m => [['Затяжек', m.puffs], ['Выкурено', totals.cigarillo || 0]],
